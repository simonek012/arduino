<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Čo ja viem</title>
<style>
:root{--bg:#D9480B;--bg2:#FF9248;--card:rgba(255,255,255,.12);--card2:rgba(255,255,255,.18);--line:rgba(255,255,255,.42);--text:#FFFFFF;--muted:rgba(255,255,255,.80);--gold:#FFFFFF;--ok:#FFFFFF;--bad:#FFD166;--a:#FFFFFF;--b:#FFC53D;--c:#6E1E03;--deep:#B63A07;
--disp:system-ui,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 90% at 50% -20%,var(--bg2) 0%,var(--bg) 62%,#B63A07 100%);background-attachment:fixed;color:var(--text);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;padding-inline:16px}
.app{max-width:1180px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.eyebrow{display:block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.big{font:900 clamp(30px,5vw,54px)/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,32px);box-shadow:0 10px 30px rgba(120,40,0,.18)}
.muted{color:var(--muted)}
.btn{border:2px solid rgba(255,255,255,.5);border-radius:14px;padding:13px 22px;font-weight:800;font-size:17px;background:var(--card2);color:#fff}
.btn.gold,.btn.ok{background:#fff;color:#C7410A;border-color:#fff}
.btn.ghost{background:transparent;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap}
kbd{font:700 12px ui-monospace,Consolas,monospace;background:rgba(0,0,0,.22);border-radius:6px;padding:2px 7px}

/* logo ako na obale relácie */
.logobox{display:inline-block;border:5px solid #fff;border-radius:28px;padding:18px 34px 22px;text-align:center;background:rgba(255,255,255,.08)}
.logobox .l1{display:block;font:900 clamp(26px,4.4vw,52px)/1 var(--disp);letter-spacing:.1em}
.logobox .l2{display:block;font:900 clamp(40px,8vw,88px)/.95 var(--disp);letter-spacing:.04em}
.logobox .l3{display:block;margin-top:6px;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.85)}

/* hlavička */
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.pill{background:var(--card2);border:2px solid var(--line);border-radius:99px;padding:7px 16px;font-weight:700}
.pill b{color:#fff}

/* otázka */
.qtext{font:800 clamp(22px,3.2vw,40px)/1.2 system-ui;text-wrap:balance;max-width:30ch}
.opts{display:grid;gap:12px;margin-top:6px}
@media(min-width:900px){.opts.abc{grid-template-columns:repeat(3,1fr)}}
.opt{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.12);border:2px solid var(--line);border-radius:16px;padding:16px 18px;font-size:clamp(16px,1.6vw,22px);font-weight:700}
.opt i{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;font:900 20px var(--disp);font-style:normal}
.opt.a i{background:var(--a);color:#C7410A} .opt.b i{background:var(--b);color:#5E1A00} .opt.c i{background:var(--c);color:#fff}
.opt.right{background:#fff;color:#C7410A;border-color:#fff}
.opt.right i{background:#C7410A;color:#fff}
.opt.wrong{opacity:.45}
.ordlist{display:flex;flex-direction:column;gap:10px}
.ordlist .opt i{background:#fff;color:#C7410A}
.match{display:grid;gap:12px;margin-top:6px}
@media(min-width:900px){.match{grid-template-columns:1fr 1fr}}
.match .cisla .opt i{background:var(--b);color:#5E1A00}
.ordlist .opt.right i{background:#C7410A;color:#fff}
.opt .sip{opacity:.7}
.kod{font:900 clamp(34px,5vw,60px)/1 var(--disp);letter-spacing:.12em;margin:0 0 12px}
.uvodtext{font:600 clamp(18px,2.1vw,27px)/1.45 system-ui;max-width:62ch;text-wrap:pretty}
.card.uvod{border-style:dashed}
.casvolba{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-weight:700;color:var(--muted)}
.casvolba b{min-width:3.2ch;text-align:center;color:#fff;font-size:20px}
.casvolba .btn{padding:6px 14px;font-size:20px;line-height:1}
.pl .hlas{font:900 clamp(20px,2.2vw,28px)/1.1 var(--disp);letter-spacing:.08em}
.timer{display:flex;align-items:center;gap:16px;margin:10px 0 4px}
.timer .bar{flex:1;height:14px;border-radius:99px;background:rgba(0,0,0,.22);border:2px solid var(--line);overflow:hidden}
.timer .bar i{display:block;height:100%;background:#fff;transition:width .2s linear}
.timer .sec{font:900 clamp(28px,4vw,46px)/1 var(--disp);min-width:2.5ch;text-align:right}
.timer.low .bar i{background:var(--bad)} .timer.low .sec{color:var(--bad)}

/* hráči */
.players{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pl{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.pl .nm{font-weight:800;overflow-wrap:anywhere}
.pl .sc{font:900 clamp(22px,2.4vw,30px)/1 var(--disp)}
.pl.done{border-color:#fff;background:rgba(255,255,255,.22)}
.pl .ans{font-size:13px;color:var(--muted)}
.pl .gain{font-size:14px;font-weight:800}
.pl.off{opacity:.45}
.pl.win{background:#fff;color:#C7410A;border-color:#fff}
.pl.win .ans{color:#C7410A}

/* moderátor */
.secret{border:3px solid #fff;border-radius:18px;padding:14px 18px;background:rgba(255,255,255,.16)}
.secret .lbl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.secret .val{font:800 clamp(20px,2.4vw,30px)/1.2 system-ui}
.fact{border-left:6px solid #fff;background:rgba(0,0,0,.20);border-radius:0 14px 14px 0;padding:12px 16px;max-width:70ch;line-height:1.45}
.fact .lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;margin-bottom:4px}

/* úvod */
.roles{display:flex;gap:10px;flex-wrap:wrap}
.rbtn{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;flex:1 1 210px;color:#fff}
.rbtn b{font-size:16px} .rbtn span{color:var(--muted);font-size:13px}
.rbtn.on{border-color:#fff;background:rgba(255,255,255,.26)}
.phones{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:10px}
.qr{background:#fff;padding:10px;border-radius:14px;line-height:0}
.qr img,.qr canvas{display:block}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:#fff;color:#C7410A;font-weight:800;padding:10px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* dramatické efekty */
@keyframes cjvFlash{from{opacity:.9}to{opacity:0}}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:60;animation:cjvFlash .5s ease-out forwards}
.flash.gold{background:radial-gradient(circle at 50% 45%,#fff 0%,#FFC53D 60%,transparent 75%)}
@keyframes cjvShake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.shake{animation:cjvShake .55s}
@keyframes cjvPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.timer.low .sec{animation:cjvPulse .5s infinite}
@keyframes cjvPop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.opt.right{animation:cjvPop .35s ease-out}
.sound{margin-left:auto}
</style>
</head>
<body>
<main class="app" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>const BANK = {1: [], 2: [], 3: []};</script>
<script>
/* ---------- otázky: 1 = ľahšie, 2 = stredné, 3 = ťažké ----------
   Posledné číslo je čas na odpoveď v sekundách:
   výber z troch – 5 bežná, 6–8 na zamyslenie alebo s chytákom, 10 počtová;
   zoraďovanie   – 10 bežná, 20 veľmi ťažká;
   priraďovanie  – 8 až 12 bežná, 20 veľmi ťažká.
   Úvod moderátor prečíta pred otázkou – opisuje tému, ale neprezradí odpoveď.
   Zaujímavosť sa ukáže až po odhalení správnej odpovede.
   abc(otázka, [možnosti], index správnej, zaujímavosť, čas, úvod)
   ord(otázka, [položky v správnom poradí], zaujímavosť, čas, úvod)
   pri(otázka, [[ľavá, pravá], …] – správne dvojice, zaujímavosť, čas, úvod) */
const abc = (q, o, c, f, t, u) => ({q, o, c, f, t, u});
const ord = (q, items, f, t, u) => ({q, ord: items, f, t, u});
const pri = (q, pary, f, t, u) => ({q, pri: pary, f, t, u});

BANK[1] = [
  abc("Ktorá planéta sa okolo svojej osi otočí najrýchlejšie?", ["Zem", "Jupiter", "Mars"], 1, "Jupiter sa otočí za necelých desať hodín, preto je na póloch viditeľne sploštený.", 5, "Planéty slnečnej sústavy sa točia okolo svojej osi veľmi rozdielne rýchlo. Venuši trvá jedna otočka dlhšie ako celý jej rok, Zem to stihne za 24 hodín."),
  abc("Kto napísal knihu Alchymista?", ["Paulo Coelho", "Gabriel García Márquez", "Umberto Eco"], 0, "Prvé vydanie predalo len necelú tisícku kusov a vydavateľ zmluvu zrušil. Dnes je kniha preložená do vyše osemdesiatich jazykov.", 5, "Niektoré knihy sa stanú svetovými bestsellermi až roky po vydaní. Tento príbeh o pastierovi, ktorý hľadá poklad, sa predal v desiatkach miliónov výtlačkov."),
  abc("Čo znamená názov Wi-Fi?", ["Wireless Fidelity", "Nič, je to vymyslené meno", "Wide Field"], 1, "Meno vymyslela reklamná agentúra ako slovnú hračku na hi-fi. Vysvetlenie „wireless fidelity“ dodali až dodatočne, aby to dávalo zmysel.", 5, "Bezdrôtový internet dnes máme doma, v škole aj v autobuse. Jeho meno pozná každý, no málokto vie, odkiaľ sa vzalo."),
  abc("Ktoré zviera má najdlhšie tehotenstvo?", ["Slon", "Veľryba", "Žirafa"], 0, "Slonica nosí mláďa takmer dva roky a rodí postojačky; mláďa má pri narodení okolo sto kíl.", 5, "Mláďatá cicavcov sa v tele matky vyvíjajú rôzne dlho – myš je hotová za tri týždne, človek za deväť mesiacov."),
  abc("V ktorom meste sídli Európska centrálna banka?", ["Brusel", "Frankfurt nad Mohanom", "Luxemburg"], 1, "Banka sídli v dvojitom mrakodrape postavenom na mieste bývalej veľkoobchodnej tržnice s ovocím.", 5, "Od roku 2009 platíme eurom aj na Slovensku. O úrokových sadzbách pre celú eurozónu rozhoduje jedna spoločná banka."),
  abc("Kde vznikli prvé papierové peniaze?", ["V Číne", "V Taliansku", "V Egypte"], 0, "Číňania ich používali už v 11. storočí. Marco Polo o nich písal a v Európe mu to nechceli veriť.", 5, "Ľudia dlho platili mincami, kožušinami, soľou či mušľami. Papier ako platidlo sa objavil oveľa neskôr."),
  abc("Koľko pádov má dnešná spisovná slovenčina?", ["Šesť", "Sedem", "Osem"], 0, "Siedmy pád, vokatív, sa vytratil; zostal len v slovách ako otče, Bože alebo synku.", 5, "Slovenčina patrí medzi flektívne jazyky – podstatné mená skloňujeme podľa pádov, rodov a vzorov ako chlap, žena či mesto."),
  abc("Čo je to kaldera?", ["Prepadnutý sopečný kráter", "Morský prúd", "Púštna búrka"], 0, "Kalderu má aj ostrov Santorini – výbuch, ktorý ju vytvoril, zrejme prispel k zániku minojskej civilizácie.", 5, "Sopky sú na Zemi hlavne na okrajoch tektonických dosiek. Aj Slovensko malo kedysi sopky – Štiavnické vrchy sú zvyškom jednej obrovskej."),
  abc("Ktorý kov vedie elektrinu najlepšie?", ["Meď", "Striebro", "Zlato"], 1, "Striebro vedie najlepšie, ale do káblov sa dáva meď, pretože je mnohonásobne lacnejšia.", 5, "Elektrický prúd vedú najlepšie kovy, no ani tie nie sú rovnaké. Niektoré vedú lepšie, iné sú zasa lacnejšie."),
  ord("Zoraď vesmírne telesá od najmenšieho", ["Mesiac", "Merkúr", "Mars", "Zem"], "Merkúr je len o tretinu väčší ako náš Mesiac a je zároveň najmenšou planétou slnečnej sústavy.", 10, "Vesmírne telesá majú veľmi rozdielnu veľkosť. Niektoré mesiace sú väčšie ako celé planéty a naopak."),
  ord("Zoraď mestá podľa počtu obyvateľov, od najmenšieho", ["Bratislava", "Praha", "Budapešť", "Viedeň"], "Viedeň má takmer dva milióny obyvateľov, Bratislava necelých päťstotisíc – aj tak sú od seba len hodinu cesty.", 10, "Stredná Európa má štyri hlavné mestá na vzdialenosť pár hodín cesty autom. Každé z nich je však inak veľké."),
  ord("Zoraď rieky podľa dĺžky, od najkratšej", ["Nitra", "Hron", "Váh", "Dunaj"], "Váh je najdlhšia rieka celá na našom území, Dunaj je najdlhší zo všetkých, ale Slovenskom preteká len asi 170 kilometrov.", 10, "Slovenské rieky tečú väčšinou zo severu na juh a skončia v Dunaji a cez neho v Čiernom mori."),
  ord("Zoraď vrchy podľa výšky, od najnižšieho", ["Kriváň", "Rysy", "Lomnický štít", "Gerlachovský štít"], "Rysy sú jediný z tejto štvorice, na ktorý vedie značkovaný chodník bez sprievodcu.", 10, "Vysoké Tatry sú najvyššie pohorie Karpát. Ich štíty sú symbolom Slovenska a jeden z nich je aj na slovenských euro minciach."),
];

BANK[2] = [
  abc("Ktorý prvok má chemickú značku W?", ["Volfrám", "Vanád", "Vodík"], 0, "Značka je z nemeckého Wolfram. Volfrám má najvyššiu teplotu topenia zo všetkých kovov, vyše 3 400 stupňov, preto sa z neho robili vlákna žiaroviek.", 5, "Chemické prvky majú značky z jedného alebo dvoch písmen. Väčšinou vychádzajú z latinského názvu, no nie vždy."),
  abc("Ako sa volá jav, keď gravitácia ohne svetlo vzdialenej hviezdy?", ["Gravitačná šošovka", "Červený posun", "Paralaxa"], 0, "Jav predpovedal Einstein a potvrdili ho pri zatmení Slnka v roku 1919 – vtedy sa z Einsteina zo dňa na deň stala celebrita.", 5, "Albert Einstein ukázal, že hmota zakrivuje priestor aj čas. Tento jav dnes astronómovia využívajú ako obrovský prírodný ďalekohľad."),
  abc("Koľko percent tela dospelého človeka tvorí voda?", ["Asi 40 %", "Asi 60 %", "Asi 80 %"], 1, "Novorodenec má vody okolo 75 percent, starší človek asi polovicu. Najviac vody je v pľúcach a mozgu.", 5, "Voda je v tele všade – v krvi, v bunkách aj medzi nimi. Bez jedla vydržíme týždne, bez vody len pár dní."),
  abc("Ktorá krajina má najdlhšiu pobrežnú čiaru na svete?", ["Rusko", "Kanada", "Austrália"], 1, "Kanadské pobrežie má vyše dvestotisíc kilometrov, väčšinu tvoria ostrovy v Arktíde. Obtočilo by Zem päťkrát.", 5, "Dĺžka pobrežia závisí od toho, ako podrobne ho meriame – každá zátoka a ostrov ho predlžujú."),
  abc("Ktorá mena sa používa najdlhšie bez prerušenia?", ["Britská libra", "Švédska koruna", "Ruský rubeľ"], 0, "Libra sa používa od 8. storočia a jej meno pochádza z libry striebra, z ktorej sa razilo 240 mincí.", 5, "Meny vznikajú a zanikajú spolu so štátmi. Aj na Slovensku sme za posledných sto rokov platili niekoľkými rôznymi menami."),
  abc("Kto vymyslel slovo robot?", ["Karel Čapek", "Josef Čapek", "Isaac Asimov"], 1, "Karel Čapek slovo použil v hre R. U. R., ale sám priznal, že mu ho poradil brat Josef. Vychádza zo slova robota.", 5, "Slovo robot dnes používa celý svet. Prvýkrát zaznelo v divadelnej hre v roku 1920."),
  abc("Koľko je približne jeden svetelný rok?", ["9,5 bilióna kilometrov", "9,5 miliardy kilometrov", "950 miliónov kilometrov"], 0, "Svetlo zo Slnka k nám letí osem minút, z najbližšej hviezdy Proxima Centauri vyše štyri roky.", 8, "Vzdialenosti vo vesmíre sú také obrovské, že kilometre na ne nestačia. Astronómovia ich merajú časom, za ktorý ich preletí svetlo."),
  abc("V ktorej časti tela je väčšina buniek imunitného systému?", ["V slezine", "V črevách", "V pečeni"], 1, "V črevách je asi sedemdesiat percent imunitných buniek a mikróbov v nich máme viac, ako má telo vlastných buniek.", 5, "Imunitný systém nás chráni pred baktériami a vírusmi. Jeho bunky sú rozmiestnené po celom tele."),
  abc("Ktoré zviera má najväčší mozog?", ["Slon", "Vorvaň", "Človek"], 1, "Mozog vorvaňa váži až osem kilogramov, ľudský asi 1,4. Podľa pomeru k telu je však na tom najlepšie mravec.", 5, "Veľkosť mozgu nie je to isté ako inteligencia – dôležitý je aj pomer k veľkosti tela a to, ako je mozog stavaný."),
  abc("Ktorá krajina má najviac ostrovov?", ["Nórsko", "Švédsko", "Fínsko"], 1, "Švédsko ich má vyše dvestopäťdesiattisíc, obývaných je z nich len asi tisíc.", 5, "Škandinávske pobrežie je rozčlenené na tisíce zálivov a ostrovčekov, ktoré vytvorili ľadovce."),
  abc("Koľko percent územia Slovenska pokrývajú lesy?", ["Asi 20 %", "Asi 40 %", "Asi 60 %"], 1, "Lesy pokrývajú okolo 41 percent územia, takže Slovensko patrí medzi najzalesnenejšie krajiny Európy.", 5, "Slovensko je hornatá krajina. Veľkú časť územia pokrývajú pohoria a na nich lesy, najmä bukové a smrekové."),
  abc("Čo je to bod varu vody vo vysokých horách?", ["Vyšší ako 100 °C", "Nižší ako 100 °C", "Stále 100 °C"], 1, "Na Mount Evereste vrie voda pri zhruba 70 stupňoch – práve preto sa tam jedlo poriadne neuvarí.", 5, "Horolezci si na vysokých vrchoch varia čaj a polievky na malých varičoch. Varenie tam má svoje zvláštnosti."),
  ord("Zoraď krajiny podľa rozlohy, od najmenšej", ["Slovensko", "Česko", "Rakúsko", "Maďarsko"], "Slovensko je z tejto štvorice najmenšie, no má najvyššie hory.", 10, "Slovensko a jeho susedia vznikli z bývalej habsburskej monarchie. Rozlohou sú si pomerne podobné."),
  ord("Zoraď moria podľa hĺbky, od najplytšieho", ["Azovské more", "Baltské more", "Čierne more", "Stredozemné more"], "Azovské more má priemernú hĺbku asi sedem metrov, dá sa v ňom takmer prejsť.", 20, "Moria okolo Európy sú rôzne hlboké. Niektoré sú plytké ako rybník, iné majú na dne hlbiny vyše piatich kilometrov."),
  ord("Zoraď skladateľov podľa narodenia, od najstaršieho", ["Johann Sebastian Bach", "Wolfgang Amadeus Mozart", "Ludwig van Beethoven", "Fryderyk Chopin"], "Beethoven sa s Mozartom podľa všetkého stretol ako sedemnásťročný vo Viedni, no dôkaz o tom neexistuje.", 10, "Hudbu, ktorú hráme dodnes, písali skladatelia v rôznych storočiach – od baroka až po romantizmus."),

  const d = b.getChannelData(0), sr = b.sampleRate, n = d.length;
  let zac = 0;
  for (let i = 1; i < Math.round(0.05 * sr); i++) if (d[i - 1] <= 0 && d[i] > 0) { zac = i; break; }
  let kon = n - 1;
  for (let i = n - 2; i > n - Math.round(0.15 * sr); i--) if (d[i - 1] <= 0 && d[i] > 0) { kon = i; break; }
  b.__slucka = {od: zac / sr, do: kon / sr};
  return b.__slucka;
}
// Namerané zo záznamu relácie: dvojice tónov 64,5 a 70 Hz, 129 a 135 Hz (odtiaľ to vlnenie),
// slabšie 193 a 205 Hz a k tomu dve vrstvy šumu. Pomer pásiem sedí s predlohou na pár percent.
const TONY_PODKLAD = [[64.5, 0.110], [70, 0.094], [129, 0.120], [135, 0.098], [193, 0.050], [205, 0.035]];
const SUM_PODKLAD = [{stred: 800, q: 0.9, od: 0.035, do: 0.075, strop: 0},
                     {stred: 3000, q: 0.6, od: 0.010, do: 0.022, strop: 8000}];
function hudbaStart(sekundy) {                                 // počas odpovedania hrá nahratá časomiera
  if (!hraZvuk()) return;
  const a = ac(); if (!a) return;
  hudbaStop();
  if (zvukBuf) return hudbaZoZaznamu(sekundy);
  nacitajZvuk().then(() => {                                   // kým sa nahrávka rozbalí, hrá náhrada
    if (S.phase === 'q' && S.step === 'live') hudbaStart(Math.max(1, (S.deadline - Date.now()) / 1000));
  }).catch(() => {});
  return hudbaNahrada(sekundy);
}
/* Pri dlhšom čase nahrávku natiahneme: pokojný hukot a tikanie sa zopakujú, kým nepríde stúpanie a drop.
   Miesta na opakovanie sú nájdené rozborom nahrávky – tikanie (120 úderov za minútu) na nich
   nadväzuje, hlasitosť sedí a spoje sa prelínajú, takže opakovanie nie je počuť. */
const SLUCKY = [{od: 0.62, do: 1.5912}, {od: 4.12, do: 5.1277}];   // pokojný hukot, tikanie
const PRELINANIE = 0.15;
const natiahnute = new Map();
function natiahnutaNahravka(sekundy) {                          // vráti nahrávku, v ktorej drop padne o `sekundy` od začiatku (alebo neskôr)
  const navyse = sekundy - DROP;
  const d2 = SLUCKY[1].do - SLUCKY[1].od, d1 = SLUCKY[0].do - SLUCKY[0].od;
  const k2 = Math.ceil(navyse * 0.65 / d2);                    // väčšinu času pridáme tikaniu, zvyšok pokojnému začiatku
  const k1 = Math.max(0, Math.ceil((navyse - k2 * d2) / d1));
  const kluc = k1 + ',' + k2;
  if (natiahnute.has(kluc)) return natiahnute.get(kluc);
  const b = zvukBuf, sr = b.sampleRate, n = b.length, px = Math.round(PRELINANIE * sr);
  const smp = t => Math.round(t * sr);
  const kusy = [[0, SLUCKY[0].do]];                           // úseky nahrávky za sebou [od, do]
  for (let i = 0; i < k1; i++) kusy.push([SLUCKY[0].od, SLUCKY[0].do]);
  kusy.push([SLUCKY[0].do, SLUCKY[1].do]);
  for (let i = 0; i < k2; i++) kusy.push([SLUCKY[1].od, SLUCKY[1].do]);
  kusy.push([SLUCKY[1].do, b.duration]);
  const dlzka = kusy.reduce((sum, [od, doo]) => sum + smp(doo) - smp(od), 0);
  const out = ac().createBuffer(b.numberOfChannels, dlzka + px, sr);
  for (let ch = 0; ch < b.numberOfChannels; ch++) {
    const src = b.getChannelData(ch), dst = out.getChannelData(ch);
    let pos = 0;
    kusy.forEach(([od, doo], i) => {
      const z = smp(od), k = smp(doo);
      const skokPred = i > 0 && smp(kusy[i - 1][1]) !== z;   // pred týmto kusom sa v nahrávke skáče – prelínanie
      const skokPo = i < kusy.length - 1 && smp(kusy[i + 1][0]) !== k;
      for (let j = 0; j < k - z + (skokPo ? px : 0) && z + j < n; j++) {
        let v = src[z + j];
        if (skokPred && j < px) v *= Math.sin(Math.PI / 2 * j / px);                    // nábeh
        if (skokPo && j >= k - z) v *= Math.cos(Math.PI / 2 * (j - (k - z)) / px);     // doznievanie cez spoj
        dst[pos + j] += v;
      }
      pos += k - z;
    });
  }
  const vysledok = {buf: out, drop: DROP + k1 * d1 + k2 * d2};
  if (natiahnute.size > 4) natiahnute.delete(natiahnute.keys().next().value);
  natiahnute.set(kluc, vysledok);
  return vysledok;
}
function hudbaZoZaznamu(sekundy) {                              // odpočet posadený tak, aby drop padol na koniec času
  const a = ac(), t = a.currentTime;
  let buf = zvukBuf, drop = DROP;
  if (sekundy > DROP) ({buf, drop} = natiahnutaNahravka(sekundy));   // dlhší čas: natiahnutá nahrávka, hrá celý čas
  const g = a.createGain();
  const odkial = Math.max(0, drop - sekundy);                    // pri kratšom čase začneme neskôr v nahrávke
  g.gain.setValueAtTime(odkial > 0.05 ? 0.0001 : 0.7, t);
  if (odkial > 0.05) g.gain.exponentialRampToValueAtTime(0.7, t + 0.12);   // bez lupnutia na začiatku
  g.connect(a.destination);
  const src = a.createBufferSource();
  src.buffer = buf;
  src.connect(g);
  src.start(t, odkial);
  drone = {tony: [], sumy: [src], celk: g};
}
function zvukDrop() {                                          // keď sa hlasovanie uzavrie skôr, drop pustíme hneď
  if (!hraZvuk() || !zvukBuf) return;
  const a = ac(); if (!a) return;
  const g = a.createGain();
  g.gain.value = 0.7;
  g.connect(a.destination);
  const src = a.createBufferSource();
  src.buffer = zvukBuf;
  src.connect(g);
  src.start(a.currentTime, DROP);
  drone = {tony: [], sumy: [src], celk: g};
}
function hudbaNahrada(sekundy) {                               // keby sa nahrávka nedala prehrať
  const a = ac(); if (!a) return;
  const t = a.currentTime, koniec = t + sekundy;
  const celk = a.createGain();
  celk.gain.setValueAtTime(0.0001, t);
  celk.gain.exponentialRampToValueAtTime(0.30, t + Math.min(0.5, sekundy * 0.15));
  celk.gain.exponentialRampToValueAtTime(0.80, koniec);          // ku koncu je najhlasnejší
  celk.connect(a.destination);

  const tony = [];
  TONY_PODKLAD.forEach(([frek, hl]) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(frek, t);
    o.frequency.linearRampToValueAtTime(frek * 1.06, koniec);    // ku koncu sa tón mierne dvíha
    g.gain.value = hl;
    o.connect(g).connect(celk);
    o.start(t);
    tony.push({o, g});
  });

  const sumy = [];
  SUM_PODKLAD.forEach(s => {                                     // šum ako v zázname
    const src = a.createBufferSource();
    src.buffer = sumovyBuffer(a); src.loop = true;
    const pas = a.createBiquadFilter(); pas.type = 'bandpass'; pas.Q.value = s.q; pas.frequency.value = s.stred;
    const g = a.createGain();
    g.gain.setValueAtTime(s.od, t);
    g.gain.linearRampToValueAtTime(s.do, koniec);
    let uzol = src.connect(pas);
    if (s.strop) { const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = s.strop; uzol = uzol.connect(lp); }
    uzol.connect(g).connect(celk);
    src.start(t);
    sumy.push(src);
  });

  drone = {tony, sumy, celk};
}
function hudbaStop() {
  if (!drone) return;
  const a = ac();
  try {
    const t = a.currentTime;
    drone.celk.gain.cancelScheduledValues(t);
    drone.celk.gain.setValueAtTime(Math.max(0.0001, drone.celk.gain.value), t);
    drone.celk.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    drone.tony.forEach(x => x.o.stop(t + 0.25));
    drone.sumy.forEach(s => s.stop(t + 0.25));
  } catch (e) {}
  drone = null;
}
function zvukOdhalenie() {                                     // keď moderátor ukáže správnu odpoveď: úder ako drop na konci odpočtu
  if (!hraZvuk()) return;
  const a = ac(); if (!a) return;
  hudbaStop();                                                 // doznievanie odpočtu utneme, nech sa údery neprekrývajú
  const t = a.currentTime;
  const g = a.createGain();
  g.connect(a.destination);
  if (zvukBuf) {                                               // ten istý drop z nahrávky časomiery
    const src = a.createBufferSource();
    src.buffer = zvukBuf;
    src.connect(g);
    g.gain.setValueAtTime(0.75, t);
    g.gain.setValueAtTime(0.75, t + 2.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 4.2);
    src.start(t, DROP - 0.02);
    src.stop(t + 4.3);
    return;
  }
  const o = a.createOscillator(), og = a.createGain();         // náhrada: hlboký úder s dozvukom
  o.type = 'sine';
  o.frequency.setValueAtTime(90, t);
  o.frequency.exponentialRampToValueAtTime(32.7, t + 1.2);
  og.gain.setValueAtTime(0.9, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 3.5);
  o.connect(og).connect(g);
  g.gain.value = 0.8;
  o.start(t); o.stop(t + 3.6);
  sum(t, 0.6, 0.25, 900);
}

/* Podklad počas čítania otázky – podľa zvuku z relácie (namerané v pauzách medzi slovami moderátora):
   stály dutý akord F–C–G v niekoľkých oktávach, bez basov, bez rytmu a bez striedania akordov.
   Ladenie je o 1,3 % nižšie, rovnako ako v nahrávke časomiery, takže spolu ladia. */
const PODKLAD_TONY = [                                         // [frekvencia Hz, sila] – zmerané zo záznamu
  [172.3, 0.98], [258.2, 0.94], [344.7, 0.99], [386.9, 0.40],
  [516.5, 1.00], [689.4, 0.67], [773.8, 0.30], [1033.0, 0.24]
];
let podklad = null;
function podkladStart() {
  if (!hraZvuk()) { podkladStop(); return; }
  if (podklad) return;
  const a = ac(); if (!a) return;
  const t = a.currentTime;
  const celk = a.createGain();
  celk.gain.setValueAtTime(0.0001, t);
  celk.gain.exponentialRampToValueAtTime(0.1, t + 2.5);        // pomalý, jemný nábeh
  celk.connect(a.destination);
  const dych = a.createOscillator(), dychG = a.createGain();   // celý akord veľmi pomaly dýcha, aby nebol mŕtvy
  dych.frequency.value = 0.09; dychG.gain.value = 0.015;
  dych.connect(dychG).connect(celk.gain); dych.start(t);
  const zdroje = [dych];
  PODKLAD_TONY.forEach(([f, sila], i) => {
    const g = a.createGain(); g.gain.value = sila / PODKLAD_TONY.length;
    g.connect(celk);
    [-3, 3].forEach(cent => {                                  // dva jemne rozladené čisté tóny = mäkký, živý zvuk
      const o = a.createOscillator(); o.type = 'sine';
      o.frequency.value = f; o.detune.value = cent + (i % 2 ? 1 : -1);
      o.connect(g); o.start(t); zdroje.push(o);
    });
  });
  podklad = {celk, zdroje};
}
function podkladStop() {
  if (!podklad) return;
  const p = podklad; podklad = null;
  try {
    const a = ac(), t = a.currentTime;
    p.celk.gain.cancelScheduledValues(t);
    p.celk.gain.setValueAtTime(Math.max(0.0001, p.celk.gain.value), t);
    p.celk.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);  // jemne doznie, kým nabehne odpočet
    p.zdroje.forEach(z => z.stop(t + 0.9));
  } catch (e) {}
}
function zvukHlas(poradove) {                                 // krátke cinknutie, keď niekto odovzdá odpoveď
  if (!hraZvuk()) return;
  const a = ac(); if (!a) return;
  const t = a.currentTime;
  ton(780 + poradove * 90, t, 0.12, 0.20, 'triangle');
  ton(1560 + poradove * 90, t + 0.02, 0.09, 0.08, 'sine');
  sum(t, 0.05, 0.06, 3200);
}
function zvukTabulka(poradove, spolu) {                      // fanfára pri odkrývaní tabuľky
  if (!hraZvuk()) return;
  const a = ac(); if (!a) return;
  const t = a.currentTime;
  if (poradove < spolu) {
    ton(330 + poradove * 60, t, 0.3, 0.16, 'triangle');
    sum(t, 0.25, 0.08, 1800);
  } else {                                                     // posledný odkrytý je priebežný líder
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => ton(f, t + i * 0.1, 0.5, 0.17, 'triangle'));
    sum(t, 0.6, 0.12, 2600);
  }
}
function efekt(trieda) {                                       // svetelný záblesk a otras obrazovky
  const el = document.createElement('div');
  el.className = 'flash' + (trieda ? ' ' + trieda : '');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
  app.classList.remove('shake');
  void app.offsetWidth;
  app.classList.add('shake');
  setTimeout(() => app.classList.remove('shake'), 700);
}

/* ---------- zostavenie hry ---------- */
function pickQuestions(md) {
  const M = MODE[md];
  const treba = {1: 0, 2: 0, 3: 0};
  M.plan.forEach(blok => blok.forEach(([lvl, cnt]) => treba[lvl] += cnt));
  const trebaTyp = {1: {ord: 0, pri: 0}, 2: {ord: 0, pri: 0}, 3: {ord: 0, pri: 0}};   // koľko zoraďovačiek a priraďovačiek treba z každej úrovne
  M.plan.forEach(blok => [['ord', M.zor], ['pri', M.pri]].forEach(([typ, kolko]) => {
    for (let k = 0; k < kolko; k++) trebaTyp[blok[k % blok.length][0]][typ]++;
  }));
  for (const lvl of [1, 2, 3]) trebaTyp[lvl].abc = treba[lvl] - trebaTyp[lvl].ord - trebaTyp[lvl].pri;
  const jeTyp = (q, typ) => typ === 'abc' ? !q.ord && !q.pri : !!q[typ];
  let used = [], last = [];
  try { used = JSON.parse(localStorage.getItem(KEY_USED)) || []; } catch (e) {}
  try { last = JSON.parse(localStorage.getItem(KEY_LAST)) || []; } catch (e) {}
  const usedSet = new Set(used), lastSet = new Set(last), pools = {};
  for (const lvl of [1, 2, 3]) {
    const all = BANK[lvl].map((q, i) => ({...q, id: lvl + '-' + i, lvl}));
    let free = all.filter(q => !usedSet.has(q.id));
    if (free.length < treba[lvl]) {                            // minula sa zásoba, začíname odznova
      all.forEach(q => usedSet.delete(q.id));
      free = all.filter(q => !lastSet.has(q.id));              // otázky z minulej hry ešte vynecháme
      if (free.length < treba[lvl]) free = all;
    }
    for (const typ of ['abc', 'ord', 'pri']) {                 // keď sa minie jeden typ otázok, ten začneme odznova
      if (free.filter(q => jeTyp(q, typ)).length >= trebaTyp[lvl][typ]) continue;
      all.filter(q => jeTyp(q, typ)).forEach(q => usedSet.delete(q.id));
      free = free.concat(all.filter(q => jeTyp(q, typ) && !free.includes(q) && !lastSet.has(q.id)));
    }
    pools[lvl] = {ord: shuffle(free.filter(q => q.ord)), pri: shuffle(free.filter(q => q.pri)), abc: shuffle(free.filter(q => !q.ord && !q.pri))};
  }
  const out = [];
  M.plan.forEach(blok => {
    const chcem = {}, vybrane = [];
    blok.forEach(([lvl, cnt]) => chcem[lvl] = (chcem[lvl] || 0) + cnt);
    [['ord', M.zor], ['pri', M.pri]].forEach(([typ, kolko]) => {  // zoraďovačky a priraďovačky rozdelené medzi úrovne bloku
      for (let k = 0; k < kolko; k++) {
        const lvl = blok[k % blok.length][0];
        const q = chcem[lvl] > 0 && pools[lvl][typ].shift();
        if (q) { vybrane.push(q); chcem[lvl]--; }
      }
    });
    blok.forEach(([lvl]) => {
      for (let k = 0; k < Math.max(0, chcem[lvl]); k++) {
        const q = pools[lvl].abc.shift() || pools[lvl].ord.shift() || pools[lvl].pri.shift();
        if (q) vybrane.push(q);
      }
      chcem[lvl] = 0;
    });
    shuffle(vybrane).forEach(q => out.push(q));
  });
  out.forEach(q => usedSet.add(q.id));
  try {
    localStorage.setItem(KEY_USED, JSON.stringify([...usedSet]));
    localStorage.setItem(KEY_LAST, JSON.stringify(out.map(q => q.id)));
  } catch (e) {}
  return out.map(q => {
    if (q.pri) {                                               // ľavá strana A, B, C…; pravá zamiešaná a očíslovaná 1, 2, 3…
      let idx = shuffle(q.pri.map((_, i) => i));
      for (let t = 0; t < 8 && idx.every((v, i) => v === i); t++) idx = shuffle(idx);
      return {kind: 'match', lvl: q.lvl, q: q.q, items: q.pri.map(p => p[0]), items2: idx.map(i => q.pri[i][1]),
              correct: q.pri.map((_, i) => idx.indexOf(i)), fact: q.f, uvod: q.u, sec: q.t || SEC.match[q.lvl]};
    }
    if (!q.ord) {                                              // poradie možností sa mieša, aby správna nebola stále rovnaké písmeno
      const mix = shuffle([0, 1, 2]);
      return {kind: 'abc', lvl: q.lvl, q: q.q, items: mix.map(i => q.o[i]), correct: mix.indexOf(q.c), fact: q.f, uvod: q.u, sec: q.t || SEC.abc[q.lvl]};
    }
    let idx = shuffle(q.ord.map((_, i) => i));                 // poradie, v akom to uvidia hráči
    for (let t = 0; t < 8 && idx.every((v, i) => v === i); t++) idx = shuffle(idx);   // nech to náhodou nie je hneď správne zoradené
    return {kind: 'order', lvl: q.lvl, q: q.q, items: idx.map(i => q.ord[i]),
            correct: idx.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]).map(p => p[1]), fact: q.f, uvod: q.u, sec: q.t || SEC.order[q.lvl]};
  });
}
function startGame(players, md) {
  ac();                                                        // zvuk si vypýtame hneď pri kliknutí
  nacitajZvuk().catch(() => {});                               // a nahrávku časomiery rozbalíme dopredu
  const qs = pickQuestions(md);
  S = {phase: 'q', mode: md, step: 'read', i: 0, gid: Math.random().toString(36).slice(2),
       players: players.map(p => ({id: p.id, name: p.name, score: 0, ms: 0, spravne: 0})),
       qs, result: null, epoch: -1};
  api('idle').catch(() => {});
  render();
}
const cur = () => S.qs[S.i];
const M = () => MODE[S.mode] || MODE.kratka;
const sentNow = id => srv.epoch === S.epoch && !!(srv.sent && srv.sent[id]);
const poradie = () => [...S.players].sort((a, b) => b.score - a.score || a.ms - b.ms);   // pri rovnosti bodov rozhoduje najkratší čas
const odzadu = () => [...poradie()].reverse();                 // na tabuľku: od posledného k prvému

/* ---------- vyhodnotenie ---------- */
function jeSpravne(q, v) {
  if (q.kind === 'abc') return +v === q.correct;
  const mine = String(v).split(',').map(Number);
  return q.correct.every((want, pos) => mine[pos] === want);
}
function trafene(q, v) {
  const mine = String(v).split(',').map(Number);
  return q.correct.reduce((n, want, pos) => n + (mine[pos] === want ? 1 : 0), 0);
}
function vyhodnot(odpovede) {                                    // z odpovedí spraví výsledok a ukáže hlasovanie
  const q = cur(), res = {};
  S.players.forEach(p => {
    const a = odpovede[p.id];
    if (!a) { res[p.id] = {none: true, ok: false}; return; }
    res[p.id] = {ok: jeSpravne(q, a.v), v: a.v, ms: a.ms, hits: q.kind === 'abc' ? 0 : trafene(q, a.v)};
  });
  S.result = res; S.step = 'votes';                            // najprv sa ukáže, kto za čo hlasoval
  render();
}
async function closeQuestion() {
  if (S.step !== 'live') return;
  const skoro = (S.deadline - Date.now()) > 250;               // ukončil to moderátor skôr?
  clearInterval(timerId); timerId = null;
  if (skoro) { hudbaStop(); zvukDrop(); }                        // inak nahrávka pokračuje sama dropom
  efekt();
  vyhodnot(srv.odpovede || {});                                // prepneme hneď, z priebežne stiahnutých odpovedí
  api('close').catch(() => {});
  try { const data = await api('answers'); if (S.step === 'votes') vyhodnot(data.answers); } catch (e) {}
}
function revealAnswer() {                                      // až potom moderátor odhalí správnu odpoveď
  if (S.step !== 'votes') return;
  S.players.forEach(p => {
    const r = S.result[p.id];
    if (r && r.ok) { p.score += BOD; p.spravne++; p.ms += r.ms; }
  });
  S.step = 'result';
  zvukOdhalenie(); efekt('gold');
  render();
}
async function askQuestion() {
  const q = cur();
  podkladStop();                                               // hudba pri čítaní stíchne hneď, nabehne odpočet
  S.step = 'live'; S.result = null;

    case 'start': {

      if (!online.length) return toast('Najprv pripoj aspoň jeden mobil');
      startGame(online, mode); break;

    case 'ask': if (S.step === 'read') askQuestion(); break;
    case 'cas-': zmenCas(-1); break;

    case 'close': closeQuestion(); break;
    case 'reveal': revealAnswer(); break;
    case 'next': nextQuestion(); break;

    case 'again': startGame(S.players.map(p => ({id: p.id, name: p.name})), S.mode); break;

    else if (S.step === 'votes') revealAnswer();
    else if (S.step === 'tabulka') odkriHraca();
  } else if (e.code === 'Enter' || e.code === 'NumpadEnter') {
    e.preventDefault();
    if (S.step === 'result') nextQuestion();
    else if (S.step === 'votes') revealAnswer();
    else if (S.step === 'tabulka') odkriHraca();
  }
});

/* ---------- prepojenie dvoch okien ---------- */
if (bc) {
  bc.onmessage = ({data: m}) => {
    if (!m || !m.t) return;
    if (m.t === 'hello') { if (inGame()) bc.postMessage({t: 'state', S}); bc.postMessage({t: 'ping', id: WIN, role: ROLE}); return; }
    if (m.t === 'ping') {
      if (m.role === 'mod') { const was = modAlive(); modSeen = Date.now(); if (ROLE === 'tv' && !was && inGame()) render(true); }
      else tvSeen = Date.now();
      return;
    }
    if (m.t === 'state' && m.S && m.S.phase && ROLE !== 'solo') {
      if (inGame() && m.S.gid === S.gid && (m.S.v || 0) <= (S.v || 0)) return;
      const predtym = S.step, predIdx = S.i;
      S = m.S; render(true);
      if (S.phase === 'q' && S.step !== predtym) {              // zvuk aj na druhej obrazovke
        if (S.step === 'live') hudbaStart(Math.max(1, Math.ceil((S.deadline - Date.now()) / 1000)));
        else if (S.step === 'votes' && predtym === 'live') { hudbaStop(); efekt(); }
        else if (S.step === 'result' && predIdx === S.i) { zvukOdhalenie(); efekt('gold'); }
        else if (S.step === 'tabulka') hudbaStop();
        else hudbaStop();
      }
    }
  };
  setInterval(() => bc.postMessage({t: 'ping', id: WIN, role: ROLE}), 2000);
}

/* ---------- spojenie so serverom ---------- */
async function poll() {
  try {
    const st = await api('state');
    srv = {...st, info: srv.info};
    if (S.phase === 'setup') {
      const sig = (st.players || []).map(p => p.name + p.online).join('|');   // prekresli, len keď sa zoznam naozaj zmenil
      if (sig !== lastSig) { lastSig = sig; render(true); }
    }
    else if (S.phase === 'q') {
      if (S.step === 'live') {
        S.players.forEach(p => {                               // niekto práve odovzdal odpoveď
          if (sentNow(p.id) && !ozvucene.has(p.id)) { ozvucene.add(p.id); zvukHlas(ozvucene.size); }
        });
        api('answers').then(d => { if (d.epoch === S.epoch) srv.odpovede = d.answers; }).catch(() => {});
      }
      const el = app.querySelector('#board');
      if (el) el.outerHTML = playersHtml();
    }
  } catch (e) {}
  setTimeout(poll, S.phase === 'q' && S.step === 'live' ? 300 : 900);   // počas hlasovania častejšie, nech hneď vidno, kto odpovedal
}
document.addEventListener('pointerdown', () => ac(), {once: true});
api('info').then(i => { srv.info = i; if (S.phase === 'setup') render(true); }).catch(() => {});
render(true);
poll();
if (bc) { bc.postMessage({t: 'ping', id: WIN, role: ROLE}); bc.postMessage({t: 'hello'}); }
</script>
