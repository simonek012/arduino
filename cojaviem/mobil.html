<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#D9480B">
<title>Čo ja viem – odpovedanie</title>
<style>
:root{--bg:#D9480B;--bg2:#FF9248;--card:rgba(255,255,255,.14);--line:rgba(255,255,255,.45);--text:#FFFFFF;--muted:rgba(255,255,255,.82);--gold:#FFFFFF;--ok:#FFFFFF;--bad:#FFD166;--a:#FFFFFF;--b:#FFC53D;--c:#6E1E03}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%,var(--bg2) 0%,var(--bg) 60%,#B63A07 100%);background-attachment:fixed;color:var(--text);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100dvh;display:flex;flex-direction:column;padding:14px env(safe-area-inset-right) calc(14px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
h1{margin:0 0 4px;text-align:center}
h1 .box{display:inline-block;border:3px solid #fff;border-radius:16px;padding:6px 16px 8px;font:900 22px/1.05 system-ui;letter-spacing:.04em;text-transform:uppercase}
h1 .box span{display:block;font-size:28px}
.wrap{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px;flex:1;padding-inline:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
input{width:100%;font:800 20px system-ui;padding:14px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.18);color:var(--text)}
input::placeholder{color:rgba(255,255,255,.6)}
button{font:inherit;color:inherit;cursor:pointer}
.go{width:100%;margin-top:10px;padding:16px;border:0;border-radius:12px;background:#fff;color:#C7410A;font:800 19px system-ui}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.me{font-weight:800;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:0}
.muted{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:#fff;width:100%;transition:width .2s linear}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.12);color:var(--text);font:700 17px/1.25 system-ui}
.opt b{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;font:900 18px system-ui}
.opt:nth-child(1) b{background:var(--a);color:#C7410A} .opt:nth-child(2) b{background:var(--b);color:#5E1A00} .opt:nth-child(3) b{background:var(--c);color:#fff}
.opt.pick{border-color:#fff;background:rgba(255,255,255,.3)}
.opt[disabled]{opacity:.55}
.ord{display:flex;flex-direction:column;gap:8px}
.ord button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.12);color:var(--text);font:700 16px/1.25 system-ui}
.ord button.on{border-color:#fff;background:rgba(255,255,255,.3)}
.ord .num{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:rgba(0,0,0,.2);display:grid;place-items:center;font:900 15px system-ui;color:var(--muted)}
.ord button.on .num{background:#fff;color:#C7410A}
.row{display:flex;gap:10px}
.row button{flex:1;padding:14px;border-radius:12px;border:0;font:800 17px system-ui}
.send{background:#fff;color:#C7410A}
.again{background:transparent;border:2px solid var(--line);color:var(--muted)}
.row button[disabled]{opacity:.4}
.state{text-align:center;padding:26px 14px}
.state .big{font:900 30px/1.1 system-ui;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.sent{font:900 26px/1.1 system-ui;text-transform:uppercase}
.hint{font-size:14px;color:var(--muted);text-align:center}
.foot{text-align:center;color:var(--muted);font-size:12px;padding-top:6px}

.qm{font:800 18px/1.3 system-ui;margin:0 0 12px;text-wrap:balance}
.qwait{font:700 17px/1.35 system-ui;margin:10px 0 0;color:#fff}
@keyframes cjvFlash{from{opacity:.9}to{opacity:0}}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:60;animation:cjvFlash .5s ease-out forwards}
@keyframes cjvShake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:cjvShake .55s}
@keyframes cjvPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.me.low{animation:cjvPulse .5s infinite;color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="box">Čo ja <span>viem</span></span></h1>

  <section id="join" class="card">
    <p class="muted" id="jhint">Napíš svoje meno. Potom už len odpovedáš na otázky z TV.</p>
    <form id="joinForm">
      <input id="name" maxlength="16" autocomplete="off" enterkeyhint="go" placeholder="Tvoje meno" aria-label="Tvoje meno">
      <button class="go" id="goBtn" type="submit">Pripojiť sa</button>
    </form>
    <p class="muted" id="jstatus"></p>
    <div id="backList" class="row" style="flex-wrap:wrap;margin-top:8px"></div>
  </section>

  <section id="game" class="card" hidden>
    <div class="top"><span class="me" id="me"></span><button class="link" id="rename" type="button">Zmeniť meno</button></div>
    <div id="body"></div>
  </section>

  <p class="foot">Nechaj stránku otvorenú, displej sám nezhasne.</p>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = 'cojaviem-me';
let me = null, st = {}, pickOrder = [], lastEpoch = -1, sentFor = -1, byloOtvorene = false;
function drama() {                                             // záblesk, otras a zavibrovanie, keď sa čas skončí
  const el = document.createElement('div');
  el.className = 'flash';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
  const w = document.querySelector('.wrap');
  if (w) { w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake'); setTimeout(() => w.classList.remove('shake'), 700); }
  if (navigator.vibrate) navigator.vibrate([90, 70, 180]);
}
try { me = JSON.parse(localStorage.getItem(LS)); } catch (e) {}

async function api(path, body) {
  const r = await fetch('/api/' + path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : undefined);
  if (!r.ok) throw new Error('chyba');
  return r.json();
}
function saveMe() { try { localStorage.setItem(LS, JSON.stringify(me)); } catch (e) {} }

/* ---------- displej nech nezhasne ---------- */
let wake = null, awakeVid = null, awakeSrc = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      if (wake && !wake.released) return;
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
      return;
    }
  } catch (e) { wake = null; }
  keepAwakeVideo();
}
function keepAwakeVideo() {
  if (!awakeVid) {
    awakeVid = document.createElement('video');
    awakeVid.setAttribute('playsinline', ''); awakeVid.setAttribute('webkit-playsinline', '');
    awakeVid.muted = true; awakeVid.loop = true; awakeVid.autoplay = true;
    awakeVid.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none';
    awakeVid.addEventListener('pause', () => { if (document.visibilityState === 'visible') awakeVid.play().catch(() => {}); });
    awakeVid.addEventListener('ended', () => { awakeVid.currentTime = 0; awakeVid.play().catch(() => {}); });
    document.body.appendChild(awakeVid);
  }
  if (awakeSrc) { awakeVid.play().catch(() => {}); return; }
  try {
    const c = document.createElement('canvas'); c.width = c.height = 2;
    const g = c.getContext('2d');
    setInterval(() => { g.fillStyle = g.fillStyle === '#000000' ? '#010101' : '#000000'; g.fillRect(0, 0, 2, 2); }, 200);
    const stream = c.captureStream(5);
    if (window.MediaRecorder) {
      const parts = [], rec = new MediaRecorder(stream);
      rec.ondataavailable = e => parts.push(e.data);
      rec.onstop = () => { awakeSrc = URL.createObjectURL(new Blob(parts, {type: rec.mimeType})); awakeVid.src = awakeSrc; awakeVid.play().catch(() => {}); };
      rec.start(); setTimeout(() => { try { rec.stop(); } catch (e) {} }, 1500);
    } else { awakeVid.srcObject = stream; awakeSrc = 'stream'; awakeVid.play().catch(() => {}); }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && me && me.id) { keepAwake(); if (awakeVid) awakeVid.play().catch(() => {}); } });
document.addEventListener('pointerdown', () => { if (me && me.id) keepAwake(); });

/* ---------- prihlásenie ---------- */
function showJoin() {
  $('#join').hidden = false; $('#game').hidden = true;
  if (me) $('#name').value = me.name;
  offerBack();
}
function showGame() { $('#join').hidden = true; $('#game').hidden = false; $('#me').textContent = me.name; }
function offerBack() {
  const off = (st.players || []).filter(p => !p.online);
  $('#backList').innerHTML = '';
  if (!off.length) return;
  const t = document.createElement('p'); t.className = 'muted'; t.style.width = '100%'; t.textContent = 'Alebo pokračuj ako:';
  $('#backList').appendChild(t);
  off.forEach(p => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'again'; b.style.flex = '0 0 auto'; b.style.padding = '8px 14px';
    b.textContent = p.name; b.onclick = () => doJoin(p.name, p.id);
    $('#backList').appendChild(b);
  });
}
async function doJoin(name, id) {
  keepAwake();
  if (!name) { $('#jstatus').textContent = 'Najprv napíš meno.'; return; }
  $('#goBtn').disabled = true;
  try {
    const r = await api('join', {name, id: id || (me && me.id)});
    me = {id: r.id, name: r.name}; saveMe(); showGame(); paint(); keepAwake();
  } catch (e) {
    $('#jstatus').textContent = 'Nepodarilo sa pripojiť. Si na tej istej Wi-Fi ako počítač?';
  }
  $('#goBtn').disabled = false;
}

/* ---------- odpovedanie ---------- */
async function sendAnswer(v) {
  sentFor = st.epoch;
  if (navigator.vibrate) navigator.vibrate(35);                 // krátke potvrdenie v ruke
  try { await api('answer', {id: me.id, v: String(v)}); } catch (e) { sentFor = -1; }
  st = await api('state?id=' + encodeURIComponent(me.id));
  paint();
}
function pickAbc(i) { if (!st.open || st.mine !== undefined || sentFor === st.epoch) return; sendAnswer(i); }
function toggleOrder(i) {
  const at = pickOrder.indexOf(i);
  if (at >= 0) pickOrder.splice(at, 1); else pickOrder.push(i);
  paint();
}
function sendOrder() { if (pickOrder.length === st.count) sendAnswer(pickOrder.join(',')); }

function paint() {
  if (!me || !me.id) { offerBack(); return; }
  const b = $('#body');
  const answered = st.mine !== undefined || sentFor === st.epoch;
  if (!st.open) {
    const bolo = st.q ? `<p class="qwait">${esc(st.q)}</p>` : '';
    b.innerHTML = `<div class="state"><div class="big">${st.q ? 'Čas vypršal' : 'Čakaj'}</div><p class="muted">${answered ? 'Odpoveď je odoslaná. Pozeraj na TV.' : st.q ? 'Moderátor ukazuje, kto za čo hlasoval.' : 'Moderátor o chvíľu prečíta otázku.'}</p>${bolo}</div>`;
    return;
  }
  const pct = Math.max(0, Math.min(100, (st.left / (st.seconds * 1000)) * 100));
  const secs = Math.ceil(st.left / 1000);
  const head = `<div class="top" style="margin-bottom:10px"><span class="muted">${st.kind === 'order' ? 'Zoraď na mobile' : 'Vyber odpoveď'}</span><span class="me${secs <= 5 ? ' low' : ''}">${secs} s</span></div>
    <div class="bar" style="margin-bottom:12px"><i style="width:${pct}%"></i></div>
    ${st.q ? `<p class="qm">${esc(st.q)}</p>` : ''}`;
  if (answered) {
    const mine = st.mine !== undefined ? st.mine : '';
    const txt = st.kind === 'order'
      ? String(mine).split(',').map((x, n) => `${n + 1}. ${esc(st.items[+x] || '?')}`).join('<br>')
      : 'Možnosť <b>' + 'ABC'[+mine] + '</b> – ' + esc(st.items[+mine] || '');
    b.innerHTML = head + `<div class="state"><div class="sent">Odoslané ✓</div><p class="muted" style="margin-top:8px">${txt}</p></div>`;
    return;
  }
  if (st.kind === 'order') {
    b.innerHTML = head + `<div class="ord">${st.items.map((it, i) => {
      const at = pickOrder.indexOf(i);
      return `<button type="button" class="${at >= 0 ? 'on' : ''}" data-o="${i}"><span class="num">${at >= 0 ? at + 1 : '–'}</span><span>${esc(it)}</span></button>`;
    }).join('')}</div>
    <div class="row" style="margin-top:12px">
      <button class="again" type="button" id="clr">Vyčistiť</button>
      <button class="send" type="button" id="snd"${pickOrder.length === st.count ? '' : ' disabled'}>Odoslať</button>
    </div>
    <p class="hint">Ťukaj v poradí, v akom to má ísť.</p>`;
    b.querySelectorAll('[data-o]').forEach(el => el.onclick = () => toggleOrder(+el.dataset.o));
    $('#clr').onclick = () => { pickOrder = []; paint(); };
    $('#snd').onclick = sendOrder;
    return;
  }
  b.innerHTML = head + `<div class="opts">${st.items.map((it, i) =>
    `<button type="button" class="opt" data-a="${i}"><b>${'ABC'[i]}</b><span>${esc(it)}</span></button>`).join('')}</div>
    <p class="hint">Správna odpoveď sú 2 body. Pri rovnosti rozhoduje kratší čas.</p>`;
  b.querySelectorAll('[data-a]').forEach(el => el.onclick = () => pickAbc(+el.dataset.a));
}

async function poll() {
  try {
    st = await api('state' + (me && me.id ? '?id=' + encodeURIComponent(me.id) : ''));
    if (st.epoch !== lastEpoch) { lastEpoch = st.epoch; pickOrder = []; sentFor = -1; if (st.open && navigator.vibrate) navigator.vibrate(60); }
    if (byloOtvorene && !st.open) drama();                     // čas práve vypršal
    byloOtvorene = !!st.open;
    if (me && me.id) paint(); else offerBack();
  } catch (e) {}
  setTimeout(poll, 400);                                       // pri piatich sekundách na odpoveď sa treba pýtať častejšie
}

$('#joinForm').addEventListener('submit', e => { e.preventDefault(); doJoin($('#name').value.trim()); });
$('#rename').addEventListener('click', showJoin);

if (me && me.id) { showGame(); keepAwake(); } else { showJoin(); }
poll();
</script>
</body>
</html>
