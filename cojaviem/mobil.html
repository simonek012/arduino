<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#D9480B">
<title>Čo ja viem – odpovedanie</title>
<style>
:root{--bg:#D9480B;--bg2:#FF9248;--card:rgba(255,255,255,.14);--line:rgba(255,255,255,.45);--text:#FFFFFF;--muted:rgba(255,255,255,.82);--gold:#FFFFFF;--ok:#FFFFFF;--bad:#FFD166;--a:#FFFFFF;--b:#FFC53D;--c:#6E1E03}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%,var(--bg2) 0%,var(--bg) 60%,#B63A07 100%);background-attachment:fixed;color:var(--text);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100dvh;display:flex;flex-direction:column;padding:14px env(safe-area-inset-right) calc(14px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
h1{margin:0 0 4px;text-align:center}
h1 .box{display:inline-block;border:3px solid #fff;border-radius:16px;padding:6px 16px 8px;font:900 22px/1.05 system-ui;letter-spacing:.04em;text-transform:uppercase}
h1 .box span{display:block;font-size:28px}
.wrap{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px;flex:1;padding-inline:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
input{width:100%;font:800 20px system-ui;padding:14px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.18);color:var(--text)}
input::placeholder{color:rgba(255,255,255,.6)}
button{font:inherit;color:inherit;cursor:pointer}
.go{width:100%;margin-top:10px;padding:16px;border:0;border-radius:12px;background:#fff;color:#C7410A;font:800 19px system-ui}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.me{font-weight:800;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:0}
.muted{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:#fff;width:100%;transition:width .1s linear}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.12);color:var(--text);font:700 17px/1.25 system-ui}
.opt b{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;font:900 18px system-ui}
.opt:nth-child(1) b{background:var(--a);color:#C7410A} .opt:nth-child(2) b{background:var(--b);color:#5E1A00} .opt:nth-child(3) b{background:var(--c);color:#fff}
.opt.pick{border-color:#fff;background:rgba(255,255,255,.3)}
.opt[disabled]{opacity:.55}
.ord{display:flex;flex-direction:column;gap:8px}
.ord button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.12);color:var(--text);font:700 16px/1.25 system-ui}
.ord button.on{border-color:#fff;background:rgba(255,255,255,.3)}
.ord .num{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:rgba(0,0,0,.2);display:grid;place-items:center;font:900 15px system-ui;color:var(--muted)}
.ord button.on .num{background:#FFC53D;color:#5E1A00}
.ord .lt,.par .lt,.cis b{width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;place-items:center;font:900 15px system-ui;background:#fff;color:#C7410A}
.cis{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.14)}
.cis div{display:flex;gap:10px;align-items:center;font:700 16px/1.25 system-ui}
.cis b{background:var(--b);color:#5E1A00}
.par{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.12)}
.par.on{border-color:#fff;background:rgba(255,255,255,.22)}
.par .nm{display:flex;gap:10px;align-items:center;font:700 16px/1.25 system-ui}
.par .nums{display:flex;gap:8px}
.par .nums button{flex:1;padding:10px 0;border-radius:10px;border:2px solid var(--line);background:rgba(0,0,0,.14);color:#fff;font:900 18px system-ui}
.par .nums button.on{background:#FFC53D;border-color:#FFC53D;color:#5E1A00}
.kod{font:900 30px/1.1 system-ui;letter-spacing:.12em;text-align:center;margin:8px 0 0}
.kod.maly{font-size:22px;margin:10px 0 0}
.row{display:flex;gap:10px}
.row button{flex:1;padding:14px;border-radius:12px;border:0;font:800 17px system-ui}
.send{background:#fff;color:#C7410A}
.again{background:transparent;border:2px solid var(--line);color:var(--muted)}
.row button[disabled]{opacity:.4}
.state{text-align:center;padding:26px 14px}
.state .big{font:900 30px/1.1 system-ui;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.sent{font:900 26px/1.1 system-ui;text-transform:uppercase}
.hint{font-size:14px;color:var(--muted);text-align:center}
.foot{text-align:center;color:var(--muted);font-size:12px;padding-top:6px}

.qm{font:800 18px/1.3 system-ui;margin:0 0 12px;text-wrap:balance}
.qwait{font:700 17px/1.35 system-ui;margin:10px 0 0;color:#fff}
@keyframes cjvFlash{from{opacity:.9}to{opacity:0}}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:60;animation:cjvFlash .5s ease-out forwards}
@keyframes cjvShake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:cjvShake .55s}
@keyframes cjvPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.me.low{animation:cjvPulse .5s infinite;color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="box">Čo ja <span>viem</span></span></h1>

  <section id="join" class="card">
    <p class="muted" id="jhint">Napíš svoje meno. Potom už len odpovedáš na otázky z TV.</p>
    <form id="joinForm">
      <input id="name" maxlength="16" autocomplete="off" enterkeyhint="go" placeholder="Tvoje meno" aria-label="Tvoje meno">
      <button class="go" id="goBtn" type="submit">Pripojiť sa</button>
    </form>
    <p class="muted" id="jstatus"></p>
    <div id="backList" class="row" style="flex-wrap:wrap;margin-top:8px"></div>
  </section>

  <section id="game" class="card" hidden>
    <div class="top"><span class="me" id="me"></span><button class="link" id="rename" type="button">Zmeniť meno</button></div>
    <div id="body"></div>
  </section>

  <p class="foot">Nechaj stránku otvorenú, displej sám nezhasne.</p>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = 'cojaviem-me';
let me = null, st = {}, pickOrder = [], lastEpoch = -1, sentFor = -1, sentVal = '', missedFor = -1, byloOtvorene = false;
let deadline = 0, lastKey = '', lastBack = null, rejoining = false, pary = [];
const PISM = 'ABCDEF';
function kod(v) {                                              // odpoveď v krátkom tvare: A, CADB alebo A2B3C1
  if (v == null || v === '') return '';
  if (st.kind === 'abc') return PISM[+v] || '?';
  const a = String(v).split(',').map(Number);
  if (st.kind === 'order') return a.map(i => PISM[i] || '?').join('');
  return a.map((j, i) => PISM[i] + (j >= 0 ? j + 1 : '–')).join('');
}
const now = () => performance.now();
const leftMs = () => Math.max(0, deadline - now());           // odpočet si mobil počíta sám, plynulo
const isOpen = () => !!st.open && leftMs() > 0;
function drama() {                                             // záblesk, otras a zavibrovanie, keď sa čas skončí
  const el = document.createElement('div');
  el.className = 'flash';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
  const w = document.querySelector('.wrap');
  if (w) { w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake'); setTimeout(() => w.classList.remove('shake'), 700); }
  if (navigator.vibrate) navigator.vibrate([90, 70, 180]);
}
try { me = JSON.parse(localStorage.getItem(LS)); } catch (e) {}

async function api(path, body, ms, onAbort) {                  // pri zaseknutej Wi-Fi to po čase vzdáme a skúsime znova
  const ctl = window.AbortController ? new AbortController() : null;
  if (onAbort && ctl) onAbort(() => ctl.abort());
  const tm = ctl ? setTimeout(() => ctl.abort(), ms || 6000) : 0;
  try {
    const r = await fetch('/api/' + path, {
      method: body ? 'POST' : 'GET', cache: 'no-store', signal: ctl ? ctl.signal : undefined,
      headers: body ? {'Content-Type': 'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined});
    if (!r.ok) throw new Error('chyba');
    return await r.json();
  } finally { clearTimeout(tm); }
}
function saveMe() { try { localStorage.setItem(LS, JSON.stringify(me)); } catch (e) {} }

/* ---------- displej nech nezhasne ---------- */
let wake = null, awakeVid = null, awakeSrc = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      if (wake && !wake.released) return;
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
      return;
    }
  } catch (e) { wake = null; }
  keepAwakeVideo();
}
function keepAwakeVideo() {
  if (!awakeVid) {
    awakeVid = document.createElement('video');
    awakeVid.setAttribute('playsinline', ''); awakeVid.setAttribute('webkit-playsinline', '');
    awakeVid.muted = true; awakeVid.loop = true; awakeVid.autoplay = true;
    awakeVid.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none';
    awakeVid.addEventListener('pause', () => { if (document.visibilityState === 'visible') awakeVid.play().catch(() => {}); });
    awakeVid.addEventListener('ended', () => { awakeVid.currentTime = 0; awakeVid.play().catch(() => {}); });
    document.body.appendChild(awakeVid);
  }
  if (awakeSrc) { awakeVid.play().catch(() => {}); return; }
  try {
    const c = document.createElement('canvas'); c.width = c.height = 2;
    const g = c.getContext('2d');
    setInterval(() => { g.fillStyle = g.fillStyle === '#000000' ? '#010101' : '#000000'; g.fillRect(0, 0, 2, 2); }, 200);
    const stream = c.captureStream(5);
    if (window.MediaRecorder) {
      const parts = [], rec = new MediaRecorder(stream);
      rec.ondataavailable = e => parts.push(e.data);
      rec.onstop = () => { awakeSrc = URL.createObjectURL(new Blob(parts, {type: rec.mimeType})); awakeVid.src = awakeSrc; awakeVid.play().catch(() => {}); };
      rec.start(); setTimeout(() => { try { rec.stop(); } catch (e) {} }, 1500);
    } else { awakeVid.srcObject = stream; awakeSrc = 'stream'; awakeVid.play().catch(() => {}); }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (me && me.id) { keepAwake(); if (awakeVid) awakeVid.play().catch(() => {}); }
  nudge();                                                     // po návrate do prehliadača sa hneď opýtame na stav
});
document.addEventListener('pointerdown', () => { if (me && me.id) keepAwake(); });

/* ---------- prihlásenie ---------- */
function showJoin() {
  $('#join').hidden = false; $('#game').hidden = true;
  if (me && me.name) $('#name').value = me.name;
  lastBack = null; offerBack();
}
function showGame() { $('#join').hidden = true; $('#game').hidden = false; $('#me').textContent = me.name; lastKey = ''; }
function offerBack() {                                         // prekreslí sa, len keď sa zoznam zmení – inak by sa strácali ťuknutia
  const off = (st.players || []).filter(p => !p.online);
  const sig = off.map(p => p.id + p.name).join('|');
  if (sig === lastBack) return;
  lastBack = sig;
  $('#backList').innerHTML = '';
  if (!off.length) return;
  const t = document.createElement('p'); t.className = 'muted'; t.style.width = '100%'; t.textContent = 'Alebo pokračuj ako:';
  $('#backList').appendChild(t);
  off.forEach(p => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'again'; b.style.flex = '0 0 auto'; b.style.padding = '8px 14px';
    b.textContent = p.name; b.onclick = () => doJoin(p.name, p.id);
    $('#backList').appendChild(b);
  });
}
async function doJoin(name, id) {
  keepAwake();
  if (!name) { $('#jstatus').textContent = 'Najprv napíš meno.'; return false; }
  $('#goBtn').disabled = true;
  $('#jstatus').textContent = 'Pripájam…';
  let ok = false;
  try {
    const r = await api('join', {name, id: id || (me && me.id)});
    me = {id: r.id, name: r.name}; saveMe(); showGame(); keepAwake();
    $('#jstatus').textContent = '';
    ok = true;
    nudge();
  } catch (e) {
    $('#jstatus').textContent = 'Nepodarilo sa pripojiť. Skontroluj internet alebo Wi-Fi a skús znova.';
  }
  $('#goBtn').disabled = false;
  return ok;
}

/* ---------- odpovedanie ---------- */
async function sendAnswer(v) {
  if (!isOpen()) return;
  const ep = st.epoch;
  sentFor = ep; sentVal = String(v);
  if (navigator.vibrate) navigator.vibrate(35);                 // krátke potvrdenie v ruke
  obnov();                                                     // „Odoslané“ ukážeme hneď, nečakáme na server
  let r = null;
  for (let pokus = 0; pokus < 3 && !r; pokus++) {              // keď Wi-Fi zakolíše, skúsime to ešte raz
    try { r = await api('answer', {id: me.id, v: sentVal, e: ep}, 2500); } catch (e) {}
  }
  if (st.epoch !== ep) return;
  if (!r) { sentFor = -1; }                                    // vôbec neodišlo – nech to skúsi znova
  try { prijmi(await api('state?id=' + encodeURIComponent(me.id))); } catch (e) {}
  if (r && !r.ok && st.mine === undefined && st.epoch === ep) missedFor = ep;
  obnov();
}
const answered = () => st.mine !== undefined || sentFor === st.epoch;
function pickAbc(i) { if (isOpen() && !answered()) sendAnswer(i); }
function toggleOrder(i) {
  const at = pickOrder.indexOf(i);
  if (at >= 0) pickOrder.splice(at, 1); else pickOrder.push(i);
  obnov();
}
function sendOrder() { if (pickOrder.length === st.count) sendAnswer(pickOrder.join(',')); }
function pickPar(i, j) {                                       // k písmenu i priradí číslo j; každé číslo len raz
  if (pary[i] === j) pary[i] = -1;
  else { pary = pary.map(x => x === j ? -1 : x); pary[i] = j; }
  obnov();
}
const paryHotove = () => (st.items || []).every((_, i) => pary[i] >= 0);
function sendMatch() { if (paryHotove()) sendAnswer(st.items.map((_, i) => pary[i]).join(',')); }

function casovac() {                                           // len posunie čísla a pásik, nič neprekresľuje
  const el = document.getElementById('cas'), bar = document.getElementById('casbar');
  if (!el || !bar) return;
  const left = leftMs(), secs = Math.ceil(left / 1000), sec = st.seconds || 1;
  el.textContent = secs + ' s';
  el.classList.toggle('low', secs <= Math.min(5, Math.ceil(sec / 2)));
  bar.style.width = Math.max(0, Math.min(100, left / (sec * 10))) + '%';
}
function obnov() {
  if (!me || !me.id) { offerBack(); return; }
  const open = isOpen();
  if (byloOtvorene && !open) drama();                          // čas práve vypršal
  byloOtvorene = open;
  const key = [st.epoch, open, answered(), st.mine, sentVal, missedFor === st.epoch, pickOrder.join(','), pary.join(','), st.kind, st.q, (st.items || []).join('|'), (st.items2 || []).join('|')].join('#');
  if (key !== lastKey) { lastKey = key; paint(open); }
  casovac();
}

function paint(open) {
  const b = $('#body');
  const done = answered();
  if (missedFor === st.epoch) {
    b.innerHTML = `<div class="state"><div class="big">Nestihol si</div><p class="muted">Odpoveď prišla až po čase, nepočíta sa.</p>${st.q ? `<p class="qwait">${esc(st.q)}</p>` : ''}</div>`;
    return;
  }
  if (!open) {
    const bolo = st.q ? `<p class="qwait">${esc(st.q)}</p>` : '';
    b.innerHTML = `<div class="state"><div class="big">${st.q ? 'Čas vypršal' : 'Čakaj'}</div><p class="muted">${done ? 'Odpoveď je odoslaná. Pozeraj na TV.' : st.q ? 'Moderátor ukazuje, kto za čo hlasoval.' : 'Moderátor o chvíľu prečíta otázku.'}</p>${bolo}</div>`;
    return;
  }
  const head = `<div class="top" style="margin-bottom:10px"><span class="muted">${st.kind === 'order' ? 'Zoraď na mobile' : st.kind === 'match' ? 'Priraď na mobile' : 'Vyber odpoveď'}</span><span class="me" id="cas"></span></div>
    <div class="bar" style="margin-bottom:12px"><i id="casbar"></i></div>
    ${st.q ? `<p class="qm">${esc(st.q)}</p>` : ''}`;
  if (done) {
    const mine = st.mine !== undefined ? st.mine : sentVal;
    const txt = st.kind === 'order'
      ? String(mine).split(',').map((x, n) => `${n + 1}. ${esc(st.items[+x] || '?')}`).join('<br>')
      : st.kind === 'match'
      ? String(mine).split(',').map((j, i) => `${PISM[i]} ${esc(st.items[i] || '')} → ${esc((st.items2 || [])[+j] || '?')}`).join('<br>')
      : esc(st.items[+mine] || '');
    b.innerHTML = head + `<div class="state"><div class="sent">Odoslané ✓</div><p class="kod">${kod(mine)}</p><p class="muted" style="margin-top:8px">${txt}</p></div>`;
    return;
  }
  if (st.kind === 'order') {
    b.innerHTML = head + `<div class="ord">${st.items.map((it, i) => {
      const at = pickOrder.indexOf(i);
      return `<button type="button" class="${at >= 0 ? 'on' : ''}" data-o="${i}"><span class="num">${at >= 0 ? at + 1 : '–'}</span><b class="lt">${PISM[i]}</b><span>${esc(it)}</span></button>`;
    }).join('')}</div>
    <p class="kod maly">${pickOrder.length ? kod(pickOrder.join(',')) + '_'.repeat(st.count - pickOrder.length) : '&nbsp;'}</p>
    <div class="row" style="margin-top:12px">
      <button class="again" type="button" id="clr">Vyčistiť</button>
      <button class="send" type="button" id="snd"${pickOrder.length === st.count ? '' : ' disabled'}>Odoslať</button>
    </div>
    <p class="hint">Ťukaj v poradí, v akom to má ísť.</p>`;
    b.querySelectorAll('[data-o]').forEach(el => el.onclick = () => toggleOrder(+el.dataset.o));
    $('#clr').onclick = () => { pickOrder = []; obnov(); };
    $('#snd').onclick = sendOrder;
    return;
  }
  if (st.kind === 'match') {
    const prava = st.items2 || [];
    b.innerHTML = head + `<div class="cis">${prava.map((it, j) => `<div><b>${j + 1}</b><span>${esc(it)}</span></div>`).join('')}</div>
    <div class="ord">${st.items.map((it, i) => `<div class="par ${pary[i] >= 0 ? 'on' : ''}"><div class="nm"><b class="lt">${PISM[i]}</b><span>${esc(it)}</span></div>
      <div class="nums">${prava.map((_, j) => `<button type="button" class="${pary[i] === j ? 'on' : ''}" data-p="${i},${j}">${j + 1}</button>`).join('')}</div></div>`).join('')}</div>
    <p class="kod maly">${pary.some(x => x >= 0) ? kod(st.items.map((_, i) => pary[i] >= 0 ? pary[i] : -1).join(',')) : '&nbsp;'}</p>
    <div class="row" style="margin-top:12px">
      <button class="again" type="button" id="clr">Vyčistiť</button>
      <button class="send" type="button" id="snd"${paryHotove() ? '' : ' disabled'}>Odoslať</button>
    </div>
    <p class="hint">Ku každému písmenu ťukni číslo, ktoré k nemu patrí.</p>`;
    b.querySelectorAll('[data-p]').forEach(el => el.onclick = () => { const [i, j] = el.dataset.p.split(',').map(Number); pickPar(i, j); });
    $('#clr').onclick = () => { pary = []; obnov(); };
    $('#snd').onclick = sendMatch;
    return;
  }
  b.innerHTML = head + `<div class="opts">${st.items.map((it, i) =>
    `<button type="button" class="opt" data-a="${i}"><b>${'ABC'[i]}</b><span>${esc(it)}</span></button>`).join('')}</div>
    <p class="hint">Správna odpoveď sú 2 body. Pri rovnosti rozhoduje kratší čas.</p>`;
  b.querySelectorAll('[data-a]').forEach(el => el.onclick = () => pickAbc(+el.dataset.a));
}

/* ---------- spojenie so serverom ---------- */
function prijmi(s) {                                           // nový stav zo servera
  const t = now();
  if (s.epoch !== lastEpoch) {
    lastEpoch = s.epoch; pickOrder = []; pary = []; sentFor = -1; sentVal = ''; missedFor = -1; deadline = 0;
    if (s.open && navigator.vibrate) navigator.vibrate(60);
  }
  st = s;
  if (!s.open) deadline = 0;
  else {                                                       // kedy čas skončí; z viacerých správ berieme tú najpresnejšiu
    const d = t + s.left - 150;
    deadline = deadline ? Math.min(deadline, d) : d;
  }
  if (me && me.id && s.known === false) {                      // server nás nepozná (reštart, nový priečinok…)
    if (s.kicked) { me = {name: me.name}; saveMe(); showJoin(); return; }   // moderátor odpojil mobily
    if (!rejoining) { rejoining = true; doJoin(me.name, me.id).finally(() => { rejoining = false; }); }
  }
  obnov();
}
let pollT = 0, pollBusy = false, pollStop = null, nudged = false;
function nudge() {                                             // opýtaj sa hneď (po návrate z uspatia môže byť staré spojenie mŕtve)
  if (pollBusy) { if (pollStop) { nudged = true; pollStop(); } return; }
  clearTimeout(pollT); poll();
}
async function poll() {
  pollBusy = true;
  let pauza = 30;
  try {
    const q = [];
    if (me && me.id) q.push('id=' + encodeURIComponent(me.id));
    if (st.ver !== undefined) q.push('v=' + st.ver);            // server odpovie hneď, ako sa niečo zmení
    prijmi(await api('state' + (q.length ? '?' + q.join('&') : ''), null, 9000, f => { pollStop = f; }));
  } catch (e) { pauza = nudged ? 0 : 1000; st.ver = undefined; }
  pollBusy = false; pollStop = null; nudged = false;
  clearTimeout(pollT);
  pollT = setTimeout(poll, pauza);
}
setInterval(() => { if (me && me.id) obnov(); }, 100);

$('#joinForm').addEventListener('submit', e => { e.preventDefault(); doJoin($('#name').value.trim()); });
$('#rename').addEventListener('click', showJoin);

if (me && me.id) { showGame(); keepAwake(); } else { showJoin(); }
poll();
</script>
