<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kto? Čo? Koľko?</title>
<style>
:root{--bg:#140B33;--bg2:#2B1470;--card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.14);--line:rgba(255,255,255,.18);--text:#fff;--muted:rgba(255,255,255,.72);
  --kto:#FF4D8D;--co:#22C3A6;--kolko:#FFB020;--ok:#3DDC84;--bad:#FF5A5F;--disp:'Arial Black','Segoe UI Black',Impact,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(900px 600px at 110% 110%,#3A0F4F,transparent 60%),var(--bg);
  color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;padding:2.2vmin 3vmin;gap:2vmin}
.logo{font:900 clamp(30px,5.4vw,96px)/1 var(--disp);letter-spacing:-.01em;margin:0;white-space:nowrap}
.logo .a{color:var(--kto)} .logo .b{color:var(--co)} .logo .c{color:var(--kolko)}
.logo.small{font-size:clamp(18px,2.2vw,38px)}
.top{display:flex;align-items:center;gap:2vmin;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:.5em;padding:.45em .9em;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:clamp(13px,1.3vw,22px)}
.chip.typ{background:var(--tc);color:#120826;border:0}
.timer{width:clamp(56px,7vmin,110px);height:clamp(56px,7vmin,110px);border-radius:50%;display:grid;place-items:center;font:900 clamp(22px,3.2vmin,50px)/1 var(--disp);
  background:conic-gradient(var(--tc,#fff) calc(var(--p,1)*360deg),rgba(255,255,255,.12) 0);position:relative}
.timer::before{content:'';position:absolute;inset:12%;border-radius:50%;background:var(--bg)}
.timer span{position:relative}
.timer.low span{color:var(--bad)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin;text-align:center}
.big{font:900 clamp(26px,4.4vw,80px)/1.1 var(--disp);margin:0;max-width:24ch;text-wrap:balance}
.q{font:800 clamp(24px,3.6vw,64px)/1.2 system-ui;margin:0;max-width:30ch;text-wrap:balance}
.lead{font-size:clamp(16px,1.9vw,32px);color:var(--muted);margin:0;max-width:60ch;text-wrap:balance}
.eyebrow{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(12px,1.2vw,20px);color:var(--tc,var(--muted))}
.players{display:flex;flex-wrap:wrap;gap:1.2vmin;justify-content:center}
.pl{display:flex;align-items:center;gap:.6em;padding:.5em .9em .5em .5em;border-radius:14px;background:var(--card);border:2px solid transparent;font-weight:800;font-size:clamp(14px,1.5vw,26px);transition:all .2s}
.pl .dot{width:1.6em;height:1.6em;border-radius:50%;background:var(--pc);display:grid;place-items:center;color:#120826;font-size:.8em}
.pl .pts{color:var(--muted);font-weight:700}
.pl.done{border-color:var(--ok);background:rgba(61,220,132,.14)}
.pl.off{opacity:.4}
.pl.me{border-color:var(--pc)}
.pl button{background:none;border:0;color:var(--muted);font-size:1em;padding:0 .2em}
.foot{display:flex;justify-content:space-between;align-items:center;gap:2vmin}
.ctrl{display:flex;gap:1vmin}
.ctrl button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:.5em .8em;font-weight:700;font-size:clamp(12px,1.1vw,18px)}
.ctrl button:hover{color:#fff;background:var(--card2)}
kbd{font:700 .8em system-ui;background:rgba(255,255,255,.14);border-radius:5px;padding:.05em .4em;margin-left:.3em}
.btn{background:linear-gradient(90deg,var(--kto),var(--kolko));border:0;color:#140826;font:900 clamp(18px,2.2vw,36px)/1 var(--disp);padding:.7em 1.4em;border-radius:16px;box-shadow:0 8px 30px rgba(255,77,141,.35)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:var(--card);color:#fff;box-shadow:none;border:1px solid var(--line);font-size:clamp(14px,1.4vw,22px);font-family:system-ui;font-weight:800}
/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:3vmin;width:100%;max-width:1500px;align-items:start;text-align:left}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:2.4vmin}
.panel h3{margin:0 0 1.2vmin;font-size:clamp(16px,1.6vw,26px)}
.join{display:flex;gap:2.4vmin;align-items:center}
.qr{background:#fff;padding:10px;border-radius:14px;width:clamp(150px,19vmin,280px);height:clamp(150px,19vmin,280px);display:grid;place-items:center;flex:0 0 auto}
.qr img,.qr canvas{width:100%!important;height:auto!important}
.url{font:800 clamp(16px,2vw,34px)/1.2 system-ui;word-break:break-all;color:var(--kolko)}
.modes{display:flex;flex-direction:column;gap:1vmin}
.mode{display:flex;align-items:center;gap:1.4vmin;padding:1vmin 1.4vmin;border-radius:14px;background:rgba(0,0,0,.18)}
.mode .ic{font-size:clamp(20px,2.4vw,40px)}
.mode b{font-size:clamp(15px,1.5vw,24px);color:var(--tc)}
.mode small{display:block;color:var(--muted);font-size:clamp(11px,1vw,16px)}
.mode .n{margin-left:auto;display:flex;align-items:center;gap:.6em;font-weight:900;font-size:clamp(16px,1.6vw,26px)}
.mode .n button{width:1.8em;height:1.8em;border-radius:50%;border:1px solid var(--line);background:var(--card);color:#fff;font-weight:900}
/* úvod kola */
.intro .ic{font-size:clamp(70px,13vmin,200px);line-height:1;animation:pop .6s cubic-bezier(.2,.8,.2,1)}
.intro .big{color:var(--tc)}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
/* kto */
.quote{background:#fff;color:#1A0E3D;border-radius:26px;padding:3vmin 4vmin;font:800 clamp(24px,3.6vw,64px)/1.25 system-ui;max-width:28ch;position:relative;box-shadow:0 18px 60px rgba(0,0,0,.4);text-wrap:balance;animation:pop .45s ease}
.quote::after{content:'';position:absolute;left:12%;bottom:-24px;border:14px solid transparent;border-top:14px solid #fff;border-right:14px solid #fff}
.author{font:900 clamp(26px,4vw,70px)/1 var(--disp);color:var(--pc);animation:pop .5s ease}
.votes{display:flex;flex-wrap:wrap;gap:1.2vmin;justify-content:center;max-width:1300px}
.vote{padding:.5em .9em;border-radius:12px;background:var(--card);font-weight:800;font-size:clamp(14px,1.5vw,24px)}
.vote.ok{background:rgba(61,220,132,.2);border:2px solid var(--ok)} .vote.bad{background:rgba(255,90,95,.14);border:2px solid rgba(255,90,95,.5)}
/* kreslenie */
.drawwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:2.4vmin;width:100%}
.board{position:relative;background:#fff;border-radius:22px;overflow:hidden;justify-self:center;height:100%;max-width:100%;aspect-ratio:3/4;box-shadow:0 18px 60px rgba(0,0,0,.4)}
.board canvas{width:100%;height:100%;display:block}
.side{display:flex;flex-direction:column;gap:1.6vmin;min-height:0;text-align:left}
.side .bocni{margin-top:auto}
.side .bocni .players{justify-content:flex-start;gap:.8vmin}
.side .bocni .pl{font-size:clamp(12px,1.2vw,20px)}
.side .ctrl{flex-wrap:wrap;justify-content:flex-end}
.mask{font:900 clamp(20px,2.5vw,46px)/1.3 ui-monospace,Consolas,monospace;letter-spacing:.02em;overflow-wrap:anywhere}
.feed{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:.6vmin}
.feed div{padding:.4em .7em;border-radius:10px;background:var(--card);font-size:clamp(13px,1.3vw,22px);font-weight:600;animation:slide .25s ease}
.feed div.ok{background:rgba(61,220,132,.2);font-weight:800}
.feed div.close{background:rgba(255,176,32,.18)}
.feed b{color:var(--pc)}
@keyframes slide{from{transform:translateY(10px);opacity:0}}
/* odhad */
.ans{font:900 clamp(44px,8vw,150px)/1 var(--disp);color:var(--kolko);animation:pop .5s ease}
.guesses{display:flex;flex-direction:column;gap:.8vmin;width:min(1100px,92%)}
.g{display:grid;grid-template-columns:3em minmax(0,1fr) auto auto;align-items:center;gap:1.4vmin;padding:.5em .9em;border-radius:12px;background:var(--card);font-weight:800;font-size:clamp(14px,1.6vw,26px);text-align:left}
.g .r{color:var(--muted)} .g .d{color:var(--muted);font-weight:600}
.g.r1{background:rgba(255,176,32,.25)} .g .plus{color:var(--ok)}
/* skóre */
.board-sc{display:flex;flex-direction:column;gap:1vmin;width:min(1100px,94%)}
.sc{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;align-items:center;gap:1.4vmin;font-weight:900;font-size:clamp(16px,2vw,34px)}
.sc .bar{height:clamp(30px,4.6vmin,64px);border-radius:12px;background:var(--pc);display:flex;align-items:center;padding:0 .7em;color:#140826;min-width:max-content;transition:width 1s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.sc .plus{color:var(--ok);font-size:.8em}
.podium{display:flex;align-items:flex-end;gap:2vmin;justify-content:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:1vmin;font-weight:900}
.pod .blk{width:clamp(110px,14vw,240px);border-radius:16px 16px 0 0;background:var(--pc);display:grid;place-items:center;color:#140826;font:900 clamp(30px,5vw,90px)/1 var(--disp)}
.pod .nm{font-size:clamp(18px,2.4vw,40px)} .pod .pt{color:var(--muted);font-size:clamp(14px,1.6vw,26px)}
.toast{position:fixed;left:50%;bottom:3vmin;transform:translateX(-50%) translateY(40px);opacity:0;visibility:hidden;background:#fff;color:#1A0E3D;padding:.8em 1.4em;border-radius:14px;font-weight:800;transition:all .3s;z-index:20;font-size:clamp(14px,1.4vw,22px)}
.toast.show{transform:translateX(-50%);opacity:1;visibility:visible}
.pause{position:fixed;inset:0;background:rgba(10,5,30,.7);display:grid;place-items:center;z-index:15;font:900 clamp(40px,8vw,140px)/1 var(--disp)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:12;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* avatary a klamár */
.pl .dot.av{background-size:cover;background-position:center;background-color:#fff;position:relative;width:2.2em;height:2.2em}
.pl .dot.av i{position:absolute;right:-.4em;bottom:-.4em;font-style:normal;font-size:.7em;background:#fff;border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center;box-shadow:0 0 0 2px var(--pc)}
.avbig{border-radius:50%;background:#fff;object-fit:cover;display:inline-grid;place-items:center;font:900 clamp(20px,3vw,50px)/1 var(--disp);color:#140826;border:4px solid var(--pc,#fff);flex:0 0 auto}
.sc .bar img{width:1.3em;height:1.3em;border-radius:50%;margin-right:.5em;background:#fff;object-fit:cover}
.pod img.avbig{margin-bottom:.5vmin}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1.6vmin;width:min(1500px,96%)}
.kcard{display:flex;gap:1.4vmin;align-items:center;text-align:left;background:var(--card);border:2px solid var(--pc);border-radius:18px;padding:1.4vmin 1.8vmin;animation:pop .4s ease}
.kcard b{color:var(--pc);font-size:clamp(14px,1.4vw,24px)}
.kcard p{margin:.2em 0 0;font:800 clamp(18px,2.2vw,38px)/1.2 system-ui;overflow-wrap:anywhere}
.kcard small{color:var(--muted);font-weight:700;font-size:clamp(12px,1.1vw,18px)}
.kcard.kl{background:rgba(79,195,247,.22);box-shadow:0 0 40px rgba(79,195,247,.55)}
.lobby .mode{padding:.6vmin 1.2vmin}
.lobby .mode .ic{font-size:clamp(18px,2vw,32px)}
.lobby .mode b{font-size:clamp(14px,1.35vw,22px)}
.lobby .mode .n button{width:1.6em;height:1.6em}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1vmin;margin-top:1vmin}
.mini .mode{flex-direction:column;align-items:flex-start;gap:.4vmin}
.mini .mode .n{margin-left:0}
.lobbywrap{overflow:auto}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
</style>
</head>

/* ---------- výber obsahu, aby sa neopakoval ---------- */
function pouzite() { try { return JSON.parse(localStorage.getItem(POUZ_KEY)) || {}; } catch (e) { return {}; } }
function vyber(zoznam, druh, kolko) {
  const p = pouzite(); let uz = new Set(p[druh] || []);
  let volne = zoznam.map((_, i) => i).filter(i => !uz.has(i));
  if (volne.length < kolko) { uz = new Set(); volne = zoznam.map((_, i) => i); }

const bezDiakritiky = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 3) return 9;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

}
function porovnajTip(tip, slovo) {   // 'ok' | 'blizko' | ''

  let best = 9;
  for (const v of slovo.split('|')) {

    if (t === s || t.replace(/ /g, '') === s.replace(/ /g, '')) return 'ok';
    const d = lev(t, s);
    if (d <= 1 && s.length >= 5) return 'ok';            // drobný preklep pri dlhšom slove sa odpustí
    best = Math.min(best, d);

/* ================= PRIEBEH HRY ================= */
function planKol(n) {
  const out = [], max = Math.max(...DRUHY.map(t => n[t] || 0));

  return out;
}

  if (!plan.length) { toast('Zapni aspoň jeden druh kola'); return; }
  ac();
  G = {faza: 'lobby', krok: 0, plan, k: -1, n, hraci: hraci.map(p => p.id), mena: {}, body: {}, ziskKolo: {}, kresliFronta: [], deadline: 0, pauza: null};
  G.hraci.forEach(id => { G.body[id] = 0; G.mena[id] = meno(id); });
  ulozena = null;

}
function prejdi(faza, sek) {
  G.faza = faza; G.krok++;
  G.deadline = sek ? Date.now() + sek * 1000 : 0; G.dlzka = sek * 1000; G.pauza = null;
  zahraj(faza === 'koniec' ? 'fanfara' : /odhal/.test(faza) ? 'odhal' : 'faza');

}
function dalsieKolo() {

  const typ = G.plan[G.k];
  if (['kto', 'kzn', 'klamar'].includes(typ) && aktivni().length < 3) { toast(`Kolo „${TYP[typ].nazov}“ potrebuje aspoň troch hráčov – preskakujem`); return dalsieKolo(); }
  if (typ === 'kresli' && aktivni().length < 2) return dalsieKolo();

function pripis(id, b) { if (!b) return; G.body[id] = (G.body[id] || 0) + b; G.ziskKolo[id] = (G.ziskKolo[id] || 0) + b; G.zisk[id] = (G.zisk[id] || 0) + b; }

  const max = Math.max(0, ...Object.values(poc));
  Z.pocty = poc; Z.vitazi = Object.keys(poc).filter(id => max > 0 && poc[id] === max);
  G.zisk = {};

/* ----- koniec fázy (čas vypršal alebo všetci hotoví) ----- */
function koniecFazy() {
  if (!G) return;
  switch (G.faza) {
    case 'uvod': zacniTyp(); break;
    case 'kto-pis': ktoPoPisani(); break;
    case 'kto-hadaj': ktoPoHlasovani(); break;
    case 'kto-odhal': ktoOdhalDalsie(); break;
    case 'kresli-vyber': vyberSlovo(1); break;
    case 'kresli': kresliOdhal(); break;
    case 'kzn-hlas': kznOdhal(); break;
    case 'kzn-odhal': kznDalsia(); break;
    case 'klam-pis': klamPoPisani(); break;
    case 'klam-obhajoba': prejdi('klam-hlas', CAS.klamHlas); break;
    case 'klam-hlas': klamOdhal(); break;
    case 'klam-odhal': skore(); break;
    case 'kresli-odhal': kresliDalsia(); break;
    case 'odhad-tip': odhadOdhal(); break;
    case 'odhad-odhal': odhadDalsia(); break;
    case 'skore': dalsieKolo(); break;
  }
}
function vsetciHotovi() {

    case 'kto-pis': return akt.every(id => G.kto.odpovede[id] != null);
    case 'kto-hadaj': { const v = ktoVolici(); return v.length > 0 && v.every(id => G.kto.hlasy[id]); }
    case 'kresli': { const A = G.kresli.akt, h = akt.filter(id => id !== A.kreslic); return h.length > 0 && h.every(id => A.uhadli.includes(id)); }
    case 'odhad-tip': return akt.every(id => G.odhad.tipy[id] != null);
    case 'kzn-hlas': return akt.every(id => G.kzn.hlasy[id]);
    case 'klam-pis': return akt.every(id => G.klam.odpovede[id] != null);
    case 'klam-hlas': return akt.every(id => G.klam.hlasy[id] || G.klam.odpovede[id] == null);

let skoroKoniec = 0;
function skontroluj() {   // keď sú všetci hotoví, nečakáme na koniec času
  if (!G || G.pauza || !G.deadline) return;
  if (vsetciHotovi() && G.deadline - Date.now() > 1500 && skoroKoniec !== G.krok) {

  }

/* ----- vstupy z mobilov ----- */
function spracuj(v) {
  const id = v.id, d = v.d || {};
  if (!G) {   // ešte sa nehrá: kapitán môže spustiť hru
    if (d.k === 'start' && id === kapitan()) zacniHru();
    return;
  }
  if (!G.hraci.includes(id)) { G.hraci.push(id); G.body[id] = 0; G.mena[id] = meno(id); zmena(); }
  if (d.k === 'start' && id === kapitan()) { if (['skore', 'uvod', 'klam-obhajoba'].includes(G.faza)) koniecFazy(); else if (G.faza === 'koniec') { G = null; zacniHru(); } return; }
  if (d.f !== G.krok) return;   // odpoveď na už skončenú otázku
  if (G.faza === 'kto-pis' && d.k === 'kto') {
    const t = String(d.t || '').trim().slice(0, 120); if (!t) return;
    if (G.kto.odpovede[id] == null) zahraj('hlas');
    G.kto.odpovede[id] = t; zmena();
  } else if (G.faza === 'kto-hadaj' && d.k === 'hlas') {
    const autor = G.kto.poradie[G.kto.i];
    if (id === autor || d.za === id || !G.kto.poradie.includes(d.za)) return;
    if (!G.kto.hlasy[id]) zahraj('hlas');
    G.kto.hlasy[id] = d.za; zmena();
  } else if (G.faza === 'kresli-vyber' && d.k === 'slovo') {
    if (id === G.kresli.akt.kreslic) vyberSlovo(+d.u);
  } else if (G.faza === 'kzn-hlas' && d.k === 'hlas') {
    if (!G.hraci.includes(d.za)) return;
    if (!G.kzn.hlasy[id]) zahraj('hlas');
    G.kzn.hlasy[id] = d.za; zmena();
  } else if (G.faza === 'klam-pis' && d.k === 'klam') {
    const t = String(d.t || '').trim().slice(0, 120); if (!t) return;
    if (G.klam.odpovede[id] == null) zahraj('hlas');
    G.klam.odpovede[id] = t; zmena();
  } else if (G.faza === 'klam-hlas' && d.k === 'hlas') {
    if (d.za === id || G.klam.odpovede[d.za] == null) return;
    if (!G.klam.hlasy[id]) zahraj('hlas');
    G.klam.hlasy[id] = d.za; zmena();
  } else if (G.faza === 'kresli') {
    const A = G.kresli.akt;
    if (d.k === 'kresba' && id === A.kreslic) { kresbaOps(A, d.ops || []); }
    else if (d.k === 'ine' && id === A.kreslic && !A.ine) { A.ine = true; A.slovo = noveSlovo(); A.tahy = []; A.odkryte = []; prekresli(); zmena(); }
    else if (d.k === 'tip' && id !== A.kreslic && !A.uhadli.includes(id)) {
      const t = String(d.t || '').trim().slice(0, 40); if (!t) return;
      const r = porovnajTip(t, A.slovo);
      (A.mojeTipy[id] = A.mojeTipy[id] || []).push(t); if (A.mojeTipy[id].length > 6) A.mojeTipy[id].shift();
      if (r === 'ok') {
        const zost = Math.max(0, G.deadline - Date.now()) / G.dlzka;
        A.uhadli.push(id);
        const x = UROVNE[A.tazkost || 0].x;
        pripis(id, Math.round((50 + 150 * zost) * x)); pripis(A.kreslic, Math.round(40 * x));
        A.feed.push({id, ok: true}); zahraj('dobre');
      } else {
        A.feed.push({id, t, close: r === 'blizko'});
        if (r === 'blizko') A.blizko[id] = t;
      }
      if (A.feed.length > 30) A.feed.splice(0, A.feed.length - 30);
      zmena();
    }
  } else if (G.faza === 'odhad-tip' && d.k === 'odhad') {
    const x = cislo(d.v); if (x == null) return;
    if (G.odhad.tipy[id] == null) zahraj('hlas');
    G.odhad.tipy[id] = x; zmena();
  }
}
function kresbaOps(A, ops) {
  for (const op of ops) {
    if (!Array.isArray(op)) continue;
    if (op[0] === 's') A.tahy.push({id: op[1], c: String(op[2]).slice(0, 9), w: +op[3] || 6, p: [+op[4] || 0, +op[5] || 0]});
    else if (op[0] === 'p') { const t = A.tahy.find(x => x.id === op[1]); if (t) for (let i = 2; i + 1 < op.length; i += 2) t.p.push(+op[i] || 0, +op[i + 1] || 0); }
    else if (op[0] === 'u') A.tahy.pop();
    else if (op[0] === 'c') A.tahy = [];
  }
  if (A.tahy.length > 600) A.tahy.splice(0, A.tahy.length - 600);
  prekresli(); ulozCoskoro();
}

let lastVerejne = '', lastPre = {};
function verejne() {
  if (!G) return {faza: 'lobby', kapitan: kapitan()};
  const v = {krok: G.krok, faza: G.faza, typ: G.typ, kolo: G.k + 1, kol: G.plan.length, deadline: G.deadline, pauza: !!G.pauza, kapitan: kapitan(), body: G.body};
  const T = TYP[G.typ] || {};
  if (G.faza === 'uvod') Object.assign(v, {nazov: T.nazov, ikona: T.ikona, popis: T.popis});
  if (G.faza === 'kto-pis') Object.assign(v, {otazka: G.kto.otazka, odoslali: Object.keys(G.kto.odpovede)});
  if (G.faza === 'kto-hadaj' || G.faza === 'kto-odhal') {
    const K = G.kto;
    const i = ktoIdx();
    Object.assign(v, {otazka: K.otazka, odpoved: K.odpovede[K.poradie[i]], moznosti: K.poradie, hlasovali: Object.keys(ktoHlasy()), poradove: i + 1, spolu: K.poradie.length});
    if (G.faza === 'kto-odhal') Object.assign(v, {autor: K.poradie[i], hlasy: ktoHlasy()});
  }
  if (G.faza === 'kresli' || G.faza === 'kresli-odhal') {
    const A = G.kresli.akt;
    Object.assign(v, {kreslic: A.kreslic, maska: maska(A, G.faza === 'kresli-odhal'), uhadli: A.uhadli, poradove: G.kresli.i + 1, spolu: G.kresli.kolo.length});
    v.tazkost = A.tazkost;
    if (G.faza === 'kresli-odhal') v.slovo = hlavne(A.slovo);
  }
  if (G.faza === 'kresli-vyber') Object.assign(v, {kreslic: G.kresli.akt.kreslic, poradove: G.kresli.i + 1, spolu: G.kresli.kolo.length});
  if (G.faza === 'kzn-hlas' || G.faza === 'kzn-odhal') {
    const Z = G.kzn;
    Object.assign(v, {otazka: Z.otazky[Z.i], hlasovali: Object.keys(Z.hlasy), poradove: Z.i + 1, spolu: Z.otazky.length});
    if (G.faza === 'kzn-odhal') Object.assign(v, {pocty: Z.pocty, vitazi: Z.vitazi});
  }
  if (/^klam-/.test(G.faza)) {
    const L = G.klam;
    v.odoslali = Object.keys(L.odpovede);
    if (G.faza !== 'klam-pis') v.odpovede = L.odpovede;
    if (G.faza === 'klam-hlas') v.hlasovali = Object.keys(L.hlasy);
    if (G.faza === 'klam-odhal') Object.assign(v, {klamar: L.klamar, otazka: L.otazka, ina: L.ina, hlasy: L.hlasy, chyteny: L.chyteny});
  }
  if (G.faza === 'odhad-tip' || G.faza === 'odhad-odhal') {
    const O = G.odhad, q = O.otazky[O.i];
    Object.assign(v, {otazka: q[0], jednotka: q[2], odoslali: Object.keys(O.tipy), poradove: O.i + 1, spolu: O.otazky.length});
    if (G.faza === 'odhad-odhal') Object.assign(v, {spravne: q[1], fakt: q[3]});
  }
  return v;
}
function pre(id) {
  if (!G) return null;
  const p = {krok: G.krok, zisk: G.zisk ? G.zisk[id] || 0 : 0, ziskKolo: G.ziskKolo[id] || 0};
  if (G.faza === 'kto-pis') p.moja = G.kto.odpovede[id] || '';
  if (G.faza === 'kto-hadaj' || G.faza === 'kto-odhal') { p.moj = G.kto.poradie[ktoIdx()] === id; p.hlas = ktoHlasy()[id] || ''; }
  if (G.faza === 'kresli' || G.faza === 'kresli-odhal') {
    const A = G.kresli.akt;
    if (A.kreslic === id) { p.kreslim = true; if (G.faza === 'kresli') { p.slovo = hlavne(A.slovo); p.ine = !A.ine; } }
    else { p.uhadol = A.uhadli.includes(id); p.blizko = A.blizko[id] || ''; p.tipy = A.mojeTipy[id] || []; }
  }
  if (G.faza === 'odhad-tip' || G.faza === 'odhad-odhal') p.tip = G.odhad.tipy[id] == null ? null : G.odhad.tipy[id];
  if (G.faza === 'kresli-vyber' && G.kresli.akt.kreslic === id) { p.kreslim = true; p.ponuka = G.kresli.akt.ponuka.map(hlavne); }
  if (G.faza === 'kzn-hlas' || G.faza === 'kzn-odhal') p.hlas = G.kzn.hlasy[id] || '';
  if (/^klam-/.test(G.faza)) {
    const L = G.klam;
    p.klamar = L.klamar === id;                          // klamár vie, že má inú otázku
    p.otazka = p.klamar ? L.ina : L.otazka;
    p.moja = L.odpovede[id] || ''; p.hlas = L.hlasy[id] || '';
  }
  return p;
}
let pubBusy = false;
function publikuj() {
  if (pubBusy) return;
  const v = JSON.stringify(verejne());
  const zmeny = [];
  if (v !== lastVerejne) zmeny.push(() => api('verejne', v, true).then(() => { lastVerejne = v; }));
  const ids = G ? G.hraci : hraci.map(p => p.id);
  ids.forEach(id => {
    const s = JSON.stringify(pre(id));
    if (s !== lastPre[id]) zmeny.push(() => api('pre?id=' + encodeURIComponent(id), s, true).then(() => { lastPre[id] = s; }));
  });
  if (!zmeny.length) return;
  pubBusy = true;
  zmeny.reduce((pr, f) => pr.then(f), Promise.resolve()).catch(() => {}).finally(() => { pubBusy = false; });
}

  const L = G.klam, f = G.faza;

    <p class="lead">Všetci majú rovnakú otázku – <b>okrem jedného</b>. Ten je klamár a vie o tom. Otázku nahlas nečítajte!</p></div>`;
  const hlasyNa = id => Object.entries(L.hlasy).filter(([v, za]) => za === id && v !== L.klamar).length;
  const karty = Object.entries(L.odpovede).map(([id, t]) => {
    const kl = f === 'klam-odhal' && id === L.klamar, hl = f === 'klam-odhal' ? hlasyNa(id) : 0;
    return `<div class="kcard${kl ? ' kl' : ''}" style="--pc:${farba(id)}">${avBig(id, 'clamp(44px,6.5vmin,90px)')}<div><b>${esc(meno(id))}${kl ? ' · 🕵️ KLAMÁR' : ''}</b><p>${esc(t)}</p>
      ${f === 'klam-odhal' && hl ? `<small>🗳️ ${hl} ${hl === 1 ? 'hlas' : hl < 5 ? 'hlasy' : 'hlasov'}</small>` : ''}</div></div>`;
  }).join('');
  let hlava;
  if (f === 'klam-obhajoba') hlava = `<span class="eyebrow">🗣️ Obhajoba</span><h2 class="q">Vysvetlite, prečo ste napísali svoju odpoveď – ale otázku neprezraďte!</h2>`;
  else if (f === 'klam-hlas') hlava = `<span class="eyebrow">🗳️ Hlasovanie</span><h2 class="q">Kto je klamár? Hlasujte v mobile.</h2>`;
  else hlava = `<span class="eyebrow">${L.chyteny ? '✅ Klamár bol odhalený!' : '😈 Klamár unikol!'}</span><h2 class="q">Otázka bola: „${esc(L.otazka)}“</h2>
    <p class="lead"><b style="color:${farba(L.klamar)}">${esc(meno(L.klamar))}</b> mal(a) inú otázku: „${esc(L.ina)}“${G.zisk[L.klamar] ? ` · +${G.zisk[L.klamar]}` : ''}</p>`;
  return `<div class="main" style="--tc:#4FC3F7;gap:2vmin">${hlava}<div class="kgrid">${karty}</div>
    ${f === 'klam-obhajoba' ? '<p class="lead" style="font-size:clamp(13px,1.2vw,19px)">Keď ste sa vyrozprávali, stlač ⏭ Ďalej (alebo to spustí prvý hráč v mobile) a ide sa hlasovať.</p>' : ''}</div>`;
}
function feedHtml(A) {
  return A.feed.slice(-14).map(f => f.ok ? `<div class="ok" style="--pc:${farba(f.id)}">✓ <b>${esc(meno(f.id))}</b> uhádol(a)!</div>`
    : f.close ? `<div class="close" style="--pc:${farba(f.id)}"><b>${esc(meno(f.id))}</b> je veľmi blízko 🔥</div>`   // blízky tip by prezradil slovo
    : `<div style="--pc:${farba(f.id)}"><b>${esc(meno(f.id))}:</b> ${esc(f.t)}</div>`).join('');
}
function vOdhad(odhal) {
  const O = G.odhad, q = O.otazky[O.i];
  if (!odhal) return `<div class="main" style="--tc:var(--kolko)"><span class="eyebrow">Otázka ${O.i + 1} z ${O.otazky.length} · napíšte číslo do mobilu</span><h2 class="q">${esc(q[0])}</h2>${q[2] ? `<p class="lead">v jednotkách: <b>${esc(q[2])}</b></p>` : ''}</div>`;
  const z = O.vysledky || [];
  return `<div class="main" style="--tc:var(--kolko);gap:1.6vmin"><span class="eyebrow">${esc(q[0])}</span>
    <div class="ans">${fmt(q[1])} ${esc(q[2])}</div><p class="lead">${esc(q[3])}</p>
    <div class="guesses">${z.length ? z.map(x => `<div class="g ${x.r === 0 ? 'r1' : ''}" style="--pc:${farba(x.id)}"><span class="r">${x.r + 1}.</span><span style="color:${farba(x.id)}">${esc(meno(x.id))}</span>
      <span>${fmt(x.v)} <span class="d">(${x.d === 0 ? 'presne!' : `o ${fmt(Math.round(x.d * 1000) / 1000)} ${x.v > q[1] ? 'viac' : 'menej'}`})</span></span><span class="plus">${x.presne ? '🎯 ' : ''}${G.zisk[x.id] ? '+' + G.zisk[x.id] : ''}</span></div>`).join('') : '<p class="lead">Nikto netipoval.</p>'}</div></div>`;
}
function vSkore(konecne) {
  const zoz = G.hraci.slice().sort((a, b) => (G.body[b] || 0) - (G.body[a] || 0));
  const max = Math.max(1, ...zoz.map(id => G.body[id] || 0));
  if (konecne) {
    const top = zoz.slice(0, 3), ord = [top[1], top[0], top[2]].filter(Boolean), h = {0: '26vmin', 1: '19vmin', 2: '13vmin'};
    return `<div class="main" style="gap:3vmin"><span class="eyebrow" style="color:var(--kolko)">Koniec hry</span><h2 class="big">🏆 ${esc(meno(zoz[0]))} vyhráva!</h2>
      <div class="podium">${ord.map(id => { const r = zoz.indexOf(id); return `<div class="pod" style="--pc:${farba(id)}">${avBig(id, 'clamp(60px,10vmin,140px)')}<span class="nm">${esc(meno(id))}</span><span class="pt">${G.body[id] || 0} b.</span><div class="blk" style="height:${h[r]}">${r + 1}</div></div>`; }).join('')}</div>
      ${zoz.length > 3 ? `<p class="lead">${zoz.slice(3).map((id, i) => `${i + 4}. ${esc(meno(id))} (${G.body[id] || 0})`).join(' · ')}</p>` : ''}
      <div style="display:flex;gap:2vmin"><button class="btn" data-act="znova">↻ Hrať znova<kbd>Enter</kbd></button><button class="btn ghost" data-act="dolobby">Späť na úvod</button></div></div>`;
  }
  return `<div class="main"><span class="eyebrow" style="color:var(--kolko)">Priebežné poradie po ${G.k + 1}. kole</span>
    <div class="board-sc">${zoz.map((id, i) => `<div class="sc" style="--pc:${farba(id)}"><span>${i + 1}.</span><div><div class="bar" style="width:${Math.max(8, (G.body[id] || 0) / max * 100)}%">${avatarUrl(id) ? `<img src="${avatarUrl(id)}" alt="">` : ''}${esc(meno(id))}</div></div><span>${G.body[id] || 0} ${G.ziskKolo[id] ? `<span class="plus">+${G.ziskKolo[id]}</span>` : ''}</span></div>`).join('')}</div>
    <p class="lead">${G.k + 1 < G.plan.length ? `Ďalej: ${TYP[G.plan[G.k + 1]].ikona} ${TYP[G.plan[G.k + 1]].nazov}` : 'Ďalej: vyhlásenie víťaza'}</p></div>`;
}

function render() {
  const app = $('#app');
  const key = G ? G.faza + '|' + G.krok : 'lobby|' + JSON.stringify(hraci) + publicUrl + lanUrl + serverOk + JSON.stringify(nast()) + !!ulozena + zvuk;
  if (key !== lastKey) {
    lastKey = key;
    if (!G) { app.innerHTML = vLobby(); kresliQR(); return; }
    let body = '';
    switch (G.faza) {
      case 'uvod': body = vUvod(); break;
      case 'kto-pis': body = vKtoPis(); break;
      case 'kto-hadaj': body = vKtoHadaj(false); break;
      case 'kto-odhal': body = vKtoHadaj(true); break;
      case 'kresli-vyber': body = vKresliVyber(); break;
      case 'kzn-hlas': body = vKzn(false); break;
      case 'kzn-odhal': body = vKzn(true); break;
      case 'klam-pis': case 'klam-obhajoba': case 'klam-hlas': case 'klam-odhal': body = vKlam(); break;
      case 'kresli': body = vKresli(false); break;
      case 'kresli-odhal': body = vKresli(true); break;
      case 'odhad-tip': body = vOdhad(false); break;
      case 'odhad-odhal': body = vOdhad(true); break;
      case 'skore': body = vSkore(false); break;
      case 'koniec': body = vSkore(true); break;
    }
    // pri kreslení nie je spodný pás – hráči a ovládanie sú po bokoch, aby bolo plátno čo najväčšie
    app.innerHTML = hlavicka() + body + (G.faza === 'koniec' || G.faza === 'kresli' || G.faza === 'kresli-odhal' ? '' : pata());
    if (G.faza === 'kresli' || G.faza === 'kresli-odhal') prekresli();
  }
  if (!G) return;
  // časti, ktoré sa menia často
  const h = $('#hraci'); if (h) { const nh = hraciHtml(stavHraca()); if (h.outerHTML !== nh) h.outerHTML = nh; }
  const f = $('#feed'); if (f && G.kresli && G.kresli.akt) { const nf = feedHtml(G.kresli.akt); if (f.innerHTML !== nf) f.innerHTML = nf; }
  const m = $('#maska'); if (m && G.kresli && G.kresli.akt) { const t = maska(G.kresli.akt, G.faza === 'kresli-odhal'); if (m.textContent !== t) m.textContent = t; }
  const pb = document.querySelector('[data-act="pauza"]'); if (pb) pb.innerHTML = (G.pauza ? '▶ Pokračovať' : '⏸ Pauza') + '<kbd>medzera</kbd>';
  let pz = document.querySelector('.pause');
  if (G.pauza && !pz) { pz = document.createElement('div'); pz.className = 'pause'; pz.textContent = '⏸ Pauza'; document.body.appendChild(pz); }
  if (!G.pauza && pz) pz.remove();
  casomer();
}
let lastSec = -1;
function casomer() {
  const t = $('#timer'); if (!t || !G) return;
  const ms = G.pauza != null ? G.pauza : Math.max(0, G.deadline - Date.now());
  const s = Math.ceil(ms / 1000);
  t.hidden = !(G.deadline || G.pauza);
  t.style.setProperty('--p', G.dlzka ? Math.min(1, ms / G.dlzka) : 0);
  t.classList.toggle('low', s <= 5);
  $('#tsec').textContent = s;
  if (s !== lastSec) { if (s <= 5 && s > 0 && !G.pauza && /pis|hadaj|kresli$|tip/.test(G.faza)) zahraj('tik'); lastSec = s; }
}
function prekresli() {
  const cv = $('#platno'); if (!cv || !G || !G.kresli || !G.kresli.akt) return;
  if (prekresli.raf) return;
  prekresli.raf = requestAnimationFrame(() => {
    prekresli.raf = 0;
    const g = cv.getContext('2d'), k = cv.width / 1000;
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const t of G.kresli.akt.tahy) {
      g.strokeStyle = t.c; g.fillStyle = t.c; g.lineWidth = t.w * k;
      const p = t.p;
      if (p.length <= 2) { g.beginPath(); g.arc(p[0] * k, p[1] * k, t.w * k / 2, 0, Math.PI * 2); g.fill(); continue; }
      g.beginPath(); g.moveTo(p[0] * k, p[1] * k);
      for (let i = 2; i + 1 < p.length; i += 2) g.lineTo(p[i] * k, p[i + 1] * k);
      g.stroke();
    }
  });
}
function kresliQR() {
  const box = $('#qr'), url = publicUrl || lanUrl;
  if (!box || !url) return;
  if (window.QRCode) { box.innerHTML = ''; try { new QRCode(box, {text: url, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M}); } catch (e) {} }
  else box.innerHTML = '<span style="color:#140826;font-weight:800;text-align:center">QR kód sa nenačítal – použi odkaz</span>';
}

/* ---------- ovládanie na TV ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  ac();
  const a = b.dataset.act;
  if (a === 'start') zacniHru();
  else if (a === 'nast') { const n = nast(), k = b.dataset.k, lim = {kto: [0, 4], kresli: [0, 4], odhad: [0, 4], kzn: [0, 4], klamar: [0, 4], kresieb: [1, 8], otazok: [2, 8], kznOtazok: [2, 8]}[k]; n[k] = Math.max(lim[0], Math.min(lim[1], n[k] + (+b.dataset.d))); ulozNast(n); render(); }
  else if (a === 'vyhod') api('vyhod?id=' + encodeURIComponent(b.dataset.id), {}).then(nacitajHracov).catch(() => {});
  else if (a === 'odpoj') { if (confirm('Naozaj odpojiť všetky mobily? Hráči sa budú musieť pripojiť znova.')) api('reset', {}).then(nacitajHracov).catch(() => {}); }
  else if (a === 'zvuk') { zvuk = !zvuk; try { localStorage.setItem(ZVUK_KEY, zvuk ? '1' : '0'); } catch (e) {} lastKey = ''; render(); }
  else if (a === 'pokracuj') pokracuj();
  else if (a === 'bot') pridajBota();
  else if (a === 'botiPreč') odstranBotov();
  else if (a === 'pauza') pauza();
  else if (a === 'dalej') { if (G && G.faza !== 'koniec') { if (G.pauza != null) pauza(); koniecFazy(); } }
  else if (a === 'koniec') { if (G && confirm('Ukončiť hru a vyhlásiť výsledky?')) { G.k = G.plan.length; prejdi('koniec', 0); konfety(); } }
  else if (a === 'znova') { G = null; zacniHru(); }
  else if (a === 'dolobby') { G = null; try { localStorage.removeItem(HRA_KEY); } catch (e) {} zmena(true); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.code === 'Enter') { if (!G) zacniHru(); else if (G.faza === 'koniec') { G = null; zacniHru(); } else if (G.faza === 'skore' || G.faza === 'uvod') koniecFazy(); }
  if (e.code === 'Space' && G) { e.preventDefault(); pauza(); }
  if (e.code === 'KeyN' && G && G.faza !== 'koniec') { if (G.pauza != null) pauza(); koniecFazy(); }
});
function pauza() {
  if (!G || !G.deadline && G.pauza == null) return;
  if (G.pauza != null) { G.deadline = Date.now() + G.pauza; G.pauza = null; }
  else { G.pauza = Math.max(0, G.deadline - Date.now()); G.deadline = 0; }
  zmena();
}
function pokracuj() {
  if (!ulozena) return;
  G = ulozena; ulozena = null;
  if (G.deadline) { G.pauza = Math.max(3000, G.deadline - G.ulozene); G.deadline = 0; }   // po obnovení začne v pauze
  lastPre = {}; lastVerejne = '';
  zmena(true);
  toast('Hra pokračuje – spusti ju medzerníkom');
}

/* ---------- skúšobní hráči (roboti) – na vyskúšanie hry osamote ---------- */
const BOT_KEY = 'kck-roboti';
let boti = []; try { boti = JSON.parse(localStorage.getItem(BOT_KEY)) || []; } catch (e) {}
function jeBot(id) { return boti.includes(id); }
const BOT_MENA = ['🤖 Robo', '🤖 Čipko', '🤖 Pixel', '🤖 Šróbik', '🤖 Bitka', '🤖 Kábel'];
const BOT_ODPOVEDE = ['Kopu ponožiek', 'Asi by som zaspal', 'Pizzu so šunkou', 'Neviem, som len robot', 'Nabíjačku na mobil', 'Lietajúci koberec', 'Tri kilá čokolády',
  'Mačku menom Fero', 'Gitaru a stan', 'Babkin recept na buchty', 'Toho by som sa bál', 'Určite by som sa smial', 'Na Orave, kde inde', 'Zjedol by som to'];
const botPlan = {};
function ulozBotov() { try { localStorage.setItem(BOT_KEY, JSON.stringify(boti)); } catch (e) {} }
async function pridajBota() {
  const mena = hraci.map(p => p.name), meno = BOT_MENA.find(m => !mena.includes(m)) || '🤖 Robo ' + (boti.length + 1);
  try { const r = await api('join', {name: meno}); if (r.id) { boti.push(r.id); ulozBotov(); await nacitajHracov(); lastKey = ''; render(); } }
  catch (e) { toast('Server nebeží'); }
}
async function odstranBotov() {
  for (const id of boti) { try { await api('vyhod?id=' + encodeURIComponent(id), {}); } catch (e) {} }
  boti = []; ulozBotov(); await nacitajHracov(); lastKey = ''; render();
}
function botiZiju() {   // roboti sa ozývajú serveru, aby boli „online“
  boti.forEach(id => api('state?id=' + encodeURIComponent(id)).then(r => {
    if (r.known === false) { boti = boti.filter(x => x !== id); ulozBotov(); }
  }).catch(() => {}));
}
function nahodnyTah(n) {
  const sid = 1000 + n, c = ['#111111', '#E53935', '#1E88E5', '#43A047', '#FB8C00'][n % 5];
  let x = 150 + Math.random() * 700, y = 150 + Math.random() * 1000;
  const ops = [['s', sid, c, 8, Math.round(x), Math.round(y)]], p = ['p', sid];
  for (let i = 0; i < 14; i++) { x = Math.max(20, Math.min(980, x + (Math.random() - .5) * 140)); y = Math.max(20, Math.min(1310, y + (Math.random() - .5) * 140)); p.push(Math.round(x), Math.round(y)); }
  ops.push(p); return ops;
}
const nahodne = a => a[Math.floor(Math.random() * a.length)];
function botiHraju() {
  if (!G || G.pauza != null || !boti.length) return;
  const now = Date.now();
  for (const id of boti) {
    if (!G.hraci.includes(id) || !online(id)) continue;
    let P = botPlan[id];
    if (!P || P.krok !== G.krok) P = botPlan[id] = {krok: G.krok, at: now + 2000 + Math.random() * 7000, hotovo: false, tahy: 0};
    if (now < P.at || P.hotovo) continue;
    const posli = d => api('vstup?id=' + encodeURIComponent(id), Object.assign({f: G.krok}, d)).catch(() => {});
    if (G.faza === 'kto-pis') { P.hotovo = true; posli({k: 'kto', t: nahodne(BOT_ODPOVEDE)}); }
    else if (G.faza === 'kresli-vyber') { P.hotovo = true; if (G.kresli.akt.kreslic === id) posli({k: 'slovo', u: Math.floor(Math.random() * 3)}); }
    else if (G.faza === 'kzn-hlas') { P.hotovo = true; posli({k: 'hlas', za: nahodne(G.hraci)}); }
    else if (G.faza === 'klam-pis') { P.hotovo = true; posli({k: 'klam', t: nahodne(BOT_ODPOVEDE)}); }
    else if (G.faza === 'klam-hlas') { P.hotovo = true; const m = Object.keys(G.klam.odpovede).filter(x => x !== id); if (m.length) posli({k: 'hlas', za: nahodne(m)}); }
    else if (G.faza === 'kto-hadaj') { const K = G.kto; P.hotovo = true; if (K.poradie[K.i] !== id) posli({k: 'hlas', za: nahodne(K.poradie.filter(x => x !== id))}); }
    else if (G.faza === 'kresli') {
      const A = G.kresli.akt;
      if (A.kreslic === id) { if (P.tahy < 14) { P.tahy++; P.at = now + 1400; posli({k: 'kresba', ops: nahodnyTah(P.tahy)}); } }
      else if (!A.uhadli.includes(id)) { P.at = now + 6000 + Math.random() * 9000; posli({k: 'tip', t: Math.random() < .3 ? hlavne(A.slovo) : hlavne(nahodne(SLOVA))}); }
    }
    else if (G.faza === 'odhad-tip') {
      P.hotovo = true;
      const q = G.odhad.otazky[G.odhad.i][1], v = q * (0.5 + Math.random());
      posli({k: 'odhad', v: Number.isInteger(q) ? Math.round(v) : Math.round(v * 100) / 100});
    }
  }
}
tikac(2000, botiZiju);
tikac(500, botiHraju);

/* ---------- slučky ---------- */
function nacitajHracov() {
  return api('hraci').then(r => {
    serverOk = true;
    const nove = JSON.stringify(r.hraci || []);
    if (nove !== JSON.stringify(hraci) || (r.public || '') !== publicUrl) { hraci = r.hraci || []; publicUrl = r.public || ''; if (!G) lastKey = ''; render(); }
    if (G) hraci.forEach(p => { if (!G.hraci.includes(p.id) && p.online) { G.hraci.push(p.id); G.body[p.id] = 0; G.mena[p.id] = p.name; zmena(); } });
  }).catch(() => { if (serverOk) { serverOk = false; if (!G) { lastKey = ''; render(); } } });
}
api('info').then(r => { if (r.ips && r.ips.length) lanUrl = `http://${r.ips[0]}:${r.port}/m`; if (r.public) publicUrl = r.public; lastKey = ''; render(); }).catch(() => {});
let vstupyBusy = false;
function nacitajVstupy() {
  if (vstupyBusy) return;
  vstupyBusy = true;
  api('vstupy?od=' + Math.max(0, lastN)).then(r => {
    if (lastN < 0) { lastN = r.max || 0; return; }          // staré vstupy z minulosti preskočíme
    if ((r.max || 0) < lastN) lastN = 0;                    // server sa reštartoval
    for (const v of r.v || []) { if (v.n > lastN) { lastN = v.n; try { spracuj(v); } catch (e) { console.error(e); } } }
  }).catch(() => {}).finally(() => { vstupyBusy = false; });
}
tikac(150, nacitajVstupy);
tikac(1000, nacitajHracov);
tikac(250, () => {
  if (G && !G.pauza && G.deadline && Date.now() >= G.deadline) koniecFazy();
  if (G && G.faza === 'kresli' && !G.pauza) {
    const A = G.kresli.akt, uplynulo = 1 - Math.max(0, G.deadline - Date.now()) / G.dlzka;
    if (uplynulo > .5 && A.odkryte.length < 1) odkryPismeno(A);
    if (uplynulo > .75 && A.odkryte.length < 2) odkryPismeno(A);
  }
  skontroluj();
  casomer();
  publikuj();
});
nacitajHracov();
render();
</script>
</body>
