<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140B33">
<title>Kto? Čo? Koľko?</title>
<style>
:root{--bg:#140B33;--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.2);--text:#fff;--muted:rgba(255,255,255,.72);--kto:#FF4D8D;--co:#22C3A6;--kolko:#FFB020;--ok:#3DDC84;--bad:#FF5A5F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(700px 500px at 0 0,#2B1470,transparent 70%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));overscroll-behavior:none}
[hidden]{display:none!important}
.logo{font:900 34px/1 'Arial Black',Impact,system-ui;margin:4px 0 14px;letter-spacing:-.01em}
.logo .a{color:var(--kto)} .logo .b{color:var(--co)} .logo .c{color:var(--kolko)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
input,textarea{width:100%;font:700 20px system-ui;padding:14px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus{outline:none;border-color:var(--kolko)}
textarea{min-height:110px;resize:none}
button{font:inherit;cursor:pointer}
.go{width:100%;margin-top:10px;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--kto),var(--kolko));color:#140826;font:900 20px system-ui}
.go:disabled{opacity:.45}
.ghost{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;font:800 16px system-ui}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.me{font-weight:900;font-size:18px} .pts{font-weight:800;color:var(--kolko)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--tc,#fff);width:100%;transition:width .25s linear}
.eye{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--tc,var(--muted));margin:0 0 6px}
h2{margin:0 0 12px;font-size:22px;line-height:1.25}
.big{font:900 30px/1.1 'Arial Black',Impact,system-ui;margin:6px 0 10px}
.center{text-align:center}
.icon{font-size:64px;line-height:1;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;padding:15px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:#fff;font:800 18px system-ui;display:flex;align-items:center;gap:10px}
.opt .dot{width:14px;height:14px;border-radius:50%;background:var(--pc)}
.opt.on{border-color:#fff;background:rgba(255,255,255,.22)}
.quote{background:#fff;color:#1A0E3D;border-radius:18px;padding:16px;font:800 20px/1.3 system-ui;margin-bottom:14px}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.res{font:900 28px/1.15 system-ui;margin:8px 0}
/* kreslenie */
.word{font:900 24px/1.1 'Arial Black',Impact,system-ui;color:var(--co);text-align:center;margin:0 0 8px;letter-spacing:.04em}
.canvas{background:#fff;border-radius:14px;aspect-ratio:3/4;touch-action:none;display:block;margin:0 auto;
  width:min(100%,calc((100vh - 200px) * .75));width:min(100%,calc((100dvh - 200px) * .75))}
/* kto kreslí, má plátno cez celý displej */
body.kreslim{padding-top:max(8px,env(safe-area-inset-top));padding-left:8px;padding-right:8px}
body.kreslim .logo,body.kreslim .foot,body.kreslim #kresliPozn{display:none}
body.kreslim .card{padding:0;border:0;background:none;margin:0}
body.kreslim .top{margin-bottom:4px}
body.kreslim .bar{margin-bottom:6px}
body.kreslim .eye{display:none}
body.kreslim .word{font-size:20px;margin:0 0 6px}
body.kreslim .tools{gap:6px;margin-top:8px;justify-content:center}
body.kreslim .col{width:34px;height:34px}
body.kreslim .size{width:40px;height:40px}
body.kreslim .tbtn{padding:10px 12px;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.col{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.3);background:var(--c)}
.col.on{border-color:#fff;transform:scale(1.12)}
.size{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.size i{display:block;border-radius:50%;background:#fff}
.size.on{border-color:#fff;background:rgba(255,255,255,.22)}
.tbtn{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font-weight:800;font-size:15px}
.mask{font:900 24px/1.3 ui-monospace,Consolas,monospace;letter-spacing:.14em;text-align:center;word-break:break-all;margin:6px 0 12px}
.tips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tips span{padding:5px 10px;border-radius:99px;background:var(--card);font-size:14px;color:var(--muted)}
.hot{background:rgba(255,176,32,.2);border:1px solid var(--kolko);border-radius:12px;padding:10px;margin-top:10px;font-weight:800}
.row{display:flex;gap:8px} .row input{flex:1} .row button{flex:0 0 auto;width:auto;margin:0;padding:0 18px}
.pause{position:fixed;inset:0;background:rgba(10,5,30,.8);display:grid;place-items:center;font:900 40px 'Arial Black',system-ui;z-index:9}
.status{text-align:center;color:var(--muted);font-size:14px;min-height:1.2em;margin:6px 0 0}
.status.err{color:var(--bad);font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:12px;padding-top:6px}
.opt small{font-weight:600;color:var(--muted);font-size:14px}
.av{width:28px;height:28px;border-radius:50%;background:#fff center/cover;flex:0 0 auto}
.klam{background:rgba(79,195,247,.18);border:2px solid #4FC3F7;border-radius:14px;padding:12px;font-weight:800;margin-bottom:12px}
.rfx{height:58vh;border-radius:28px;display:grid;place-items:center;text-align:center;background:#C0392B;color:#fff;font:900 40px/1.1 'Arial Black',Impact,system-ui;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:20px}
.rfx.go{background:#2ECC71;color:#062814}
.rfx.done{background:#3a3550;font-size:34px}
.mriezka{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 12px}
.mriezka span{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:34px}
.pam{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pam .opt{justify-content:center;font-size:26px}
.vy{display:flex;flex-direction:column;gap:10px;margin-top:8px}.vy .opt{min-height:68px;font-size:20px;text-align:left}.vy .opt b{font-size:26px;color:var(--tc);width:28px}
.pismeno{font:900 92px/1 system-ui;color:var(--tc);text-shadow:0 0 30px rgba(165,180,252,.4);margin:2px 0 8px}
.mm{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}.mm label{display:flex;flex-direction:column;font-weight:800;font-size:14px;color:var(--muted);gap:4px;text-align:left}.mm input{font-size:20px}
.mtab{width:100%;border-collapse:collapse;margin:8px 0;font-size:18px;text-align:left}.mtab td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.08)}.mtab td:last-child{text-align:right;font-weight:900}
.clist{display:flex;flex-direction:column;gap:6px}.cr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.2);border:2px solid transparent}
.cr.tah{border-color:var(--pc)}.cr .cm{color:var(--pc);font-weight:800;font-size:14px;flex:0 0 32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cr b{flex:1;font-size:18px;overflow-wrap:anywhere}.cr small{color:var(--muted);font-weight:800}
.mk{border-left:4px solid var(--pc);background:rgba(0,0,0,.18);border-radius:12px;padding:8px 10px;margin:8px 0}.mk>b{color:var(--pc)}
.mr{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid rgba(255,255,255,.07);font-weight:700}.mr>span:first-child{flex:1;overflow-wrap:anywhere}.mr small{color:var(--muted);font-size:12px}
.seg{display:flex;gap:4px;flex:0 0 auto}.seg button{width:44px;height:40px;margin:0;padding:0;border-radius:10px;border:2px solid var(--line);background:var(--card);color:#fff;font:900 18px system-ui}
.seg button.on.b100{background:var(--ok);border-color:var(--ok);color:#06210f}.seg button.on.b50{background:#FFB020;border-color:#FFB020;color:#2a1a00}.seg button.on.b0{background:var(--bad);border-color:var(--bad)}
.mr i{font-style:normal;font-weight:900}
.b100{color:var(--ok)}.b50{color:#FFB020}.b0{color:var(--muted)}
.bomba{font-size:90px;line-height:1;text-align:center;animation:tras .35s ease-in-out infinite alternate;margin:6px 0 18px}
@keyframes tras{from{transform:rotate(-8deg)}to{transform:rotate(8deg) scale(1.06)}}
.chain{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chain span{padding:5px 10px;border-radius:99px;background:var(--card);font-size:14px;font-weight:700}
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font:800 14px system-ui}
.tabs button.on{background:#fff;color:#140826}
.emo{font-size:30px;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.emo.on{border-color:#fff;background:rgba(255,255,255,.25)}
.zoom{width:100%;accent-color:var(--kolko)}
.avcv{display:block;margin:0 auto;width:min(100%,320px);aspect-ratio:1;background:#fff;border-radius:50%;touch-action:none}
</style>
</head>
<body>
<h1 class="logo"><span class="a">Kto?</span> <span class="b">Čo?</span> <span class="c">Koľko?</span></h1>

<form class="card" id="join">
  <div id="back" hidden><p class="muted" style="margin:0 0 8px">Vypadol si? Klikni na svoje meno:</p><div class="chips" id="backList" style="margin-bottom:14px"></div></div>
  <p class="muted" style="margin:0 0 8px">Ako sa voláš?</p>
  <input id="name" maxlength="14" autocomplete="off" enterkeyhint="go" placeholder="Tvoje meno">
  <button class="go" id="goBtn" type="submit">Pripojiť sa</button>
  <p class="status" id="jstatus"></p>
</form>

<section id="game" hidden>
  <div class="top"><span class="me" id="meName"></span><span><span class="pts" id="mePts"></span> <button class="tbtn" id="rename" type="button" style="padding:5px 9px;font-size:12px">Zmeniť meno</button><button class="tbtn" id="pauzaBtn" type="button" style="padding:5px 10px;font-size:13px" hidden>⏸ Pauza</button></span></div>
  <div class="bar" id="bar" hidden><i id="barI"></i></div>
  <div id="screen"></div>
  <p class="status" id="status"></p>
  <p class="foot">Nechaj obrazovku zapnutú – hra beží na TV.</p>
</section>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const PCOL = ['#FF4D8D', '#22C3A6', '#FFB020', '#8B6CFF', '#4FC3F7', '#FF7A45', '#B5E61D', '#F06EF0', '#FFD93D', '#5EEAD4', '#F87171', '#A5B4FC'];
const TC = {kto: 'var(--kto)', kresli: 'var(--co)', odhad: 'var(--kolko)', kzn: '#9B7BFF', klamar: '#4FC3F7', reflex: '#FFD93D', pamat: '#F06EF0', zemiak: '#FF7A45', vydrz: '#3DDC84', mmzv: '#A5B4FC', panto: '#FF6EC7', celo: '#FFC93C'};
let mmzvLok = {};   // rozpísané Meno/Mesto/Zviera/Vec – prežije aj prekreslenie obrazovky
let me = null, S = null, lastKey = '', failCount = 0, edit = {};
// na skúšku na jednom počítači: /m?hrac=2, /m?hrac=3… sú samostatní hráči
const SLOT = new URLSearchParams(location.search).get('hrac'), ME_KEY = 'kck-mobil' + (SLOT ? '-' + SLOT : '');
try { me = JSON.parse(localStorage.getItem(ME_KEY)); } catch (e) {}

function api(path, body) {
  const ctl = window.AbortController ? new AbortController() : null;
  const tm = ctl && setTimeout(() => ctl.abort(), 8000);
  return fetch('/api/' + path, Object.assign(body !== undefined ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {cache: 'no-store'}, ctl ? {signal: ctl.signal} : {}))
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .finally(() => { if (tm) clearTimeout(tm); });
}
const saveMe = () => { try { localStorage.setItem(ME_KEY, JSON.stringify(me)); } catch (e) {} };
const hra = () => (S && S.hra) || {faza: 'lobby'};
const ja = () => (S && S.ja) || {};
const meno = id => { const p = S && S.hraci.find(x => x.id === id); return p ? p.name : '?'; };
const farba = id => PCOL[Math.max(0, S ? S.hraci.findIndex(x => x.id === id) : 0) % PCOL.length];
const posli = (k, data) => api('vstup?id=' + encodeURIComponent(me.id), Object.assign({k, f: hra().krok}, data || {}));

/* ---------- pripojenie ---------- */
function showJoin() { $('#join').hidden = false; $('#game').hidden = true; if (me && me.name) $('#name').value = me.name; paintBack(); }
function showGame() { $('#join').hidden = true; $('#game').hidden = false; $('#meName').textContent = me.name; lastKey = ''; }
function paintBack() {
  const off = S ? S.hraci.filter(p => !p.online) : [];
  $('#back').hidden = !off.length;
  $('#backList').innerHTML = off.map(p => `<button type="button" class="chip" data-back="${p.id}">${esc(p.name)}</button>`).join('');
}
async function doJoin(name, id) {
  if (!name) { $('#jstatus').textContent = 'Najprv napíš meno.'; return; }
  $('#goBtn').disabled = true;
  try {
    const r = await api('join', {name, id: id || (me && me.id)});
    if (r.error) $('#jstatus').textContent = r.error;
    else { me = {id: r.id, name: r.name}; saveMe(); showGame(); poll(true); }
  } catch (e) { $('#jstatus').textContent = 'Nepodarilo sa pripojiť. Skontroluj internet alebo Wi-Fi a skús znova.'; }
  $('#goBtn').disabled = false;
}
$('#join').addEventListener('submit', e => { e.preventDefault(); doJoin($('#name').value.trim()); });
$('#backList').addEventListener('click', e => { const b = e.target.closest('[data-back]'); if (b) doJoin(b.textContent, b.dataset.back); });
$('#rename').addEventListener('click', showJoin);
$('#pauzaBtn').addEventListener('click', () => { $('#pauzaBtn').hidden = true; posli('pauza').then(() => poll(true)).catch(chyba); });

/* ---------- obrazovky ---------- */
function screenKey() {
  const h = hra(), j = ja();
  // súkromné údaje môžu prísť o chvíľu neskôr ako nová fáza – obrazovku postavíme znova, keď dorazia
  if (avEdit) return 'avatar';
  return [h.faza, h.krok, j.krok === h.krok, j.kreslim ? 'k' : '', j.moj ? 'm' : '', j.klamar ? 'K' : '', j.drzim ? 'Z' : '', j.zivy ? 'V' : '', j.herec ? 'H' : '', h.celoN, h.faza === 'lobby' ? (h.kapitan === me.id) : ''].join('|');
}
function render() {
  if (!S || !me || $('#game').hidden) return;
  const h = hra(), j = ja(), sc = $('#screen');
  document.body.style.setProperty('--tc', TC[h.typ] || '#fff');
  document.body.classList.toggle('kreslim', h.faza === 'kresli' && !!j.kreslim);
  $('#mePts').textContent = h.body ? (h.body[me.id] || 0) + ' b.' : '';
  $('#rename').hidden = h.faza !== 'lobby';
  if (avEdit && h.faza !== 'lobby') avEdit = false;   // hra sa začala – kreslenie avatara počká
  // po prvom pripojení si hráč nakreslí avatara (dá sa preskočiť)
  const ja2 = S.hraci.find(p => p.id === me.id);
  if (!avAuto && h.faza === 'lobby' && ja2 && !ja2.av) { avAuto = true; let skip = false; try { skip = localStorage.getItem('kck-av-skip-' + me.id) === '1'; } catch (e) {} if (!skip) avEdit = true; }
  const key = screenKey();
  if (key !== lastKey) { lastKey = key; if (edit.krok !== h.krok) edit = {krok: h.krok}; sc.innerHTML = postav(h, j); pripoj(h, j); }
  obnov(h, j);
  // prvý hráč môže hru pozastaviť a znova spustiť
  const kap = h.kapitan === me.id && !['lobby', 'koniec'].includes(h.faza);
  const pb = $('#pauzaBtn'); pb.hidden = !kap || !!h.pauza;
  let pz = document.querySelector('.pause');
  if (h.pauza && !pz) { pz = document.createElement('div'); pz.className = 'pause'; document.body.appendChild(pz); }
  if (pz) {
    const html = `<div class="center">⏸ Pauza${kap ? '<br><button class="go" type="button" data-pokracuj style="margin-top:20px;font-size:22px;padding:18px 28px">▶ Pokračovať</button>' : '<p class="muted" style="font:600 16px system-ui">Hra čaká…</p>'}</div>`;
    if (pz.dataset.h !== html) { pz.dataset.h = html; pz.innerHTML = html; const b = pz.querySelector('[data-pokracuj]'); if (b) b.onclick = () => { b.disabled = true; posli('pauza').then(() => poll(true)).catch(chyba); }; }
  }
  if (!h.pauza && pz) pz.remove();
}
function hlavicka(h) { return `<p class="eye">Kolo ${h.kolo} z ${h.kol}${h.spolu ? ` · ${h.poradove}/${h.spolu}` : ''}</p>`; }
function postav(h, j) {
  if (avEdit) return `<div class="card center"><h2>Tvoj obrázok</h2><p class="muted" style="margin-top:-6px">Ukáže sa na TV pri tvojom mene.</p>
      <div class="tabs" id="avTabs"><button type="button" data-m="kresli">🖌️ Nakresliť</button><button type="button" data-m="foto">🖼️ Fotka</button><button type="button" data-m="emoji">😀 Emoji</button></div>
      <canvas class="avcv" id="avcv" width="600" height="600"></canvas><div class="tools" id="avTools" style="justify-content:center"></div>
      <input type="file" id="avFile" accept="image/*" hidden>
      <button class="go" type="button" id="avOk">Hotovo ✓</button><button class="ghost" type="button" id="avSkip">Preskočiť</button></div>`;
  const kart = id => { const p = S.hraci.find(x => x.id === id); return p && p.av ? `<span class="av" style="background-image:url('/api/avatar?id=${encodeURIComponent(id)}&v=${p.av}')"></span>` : '<span class="dot"></span>'; };
  switch (h.faza) {
    case 'lobby': return `<div class="card center"><div class="icon">✅</div><h2>Si v hre!</h2><p class="muted" id="lobbyTxt"></p><div class="chips" id="lobbyHraci" style="justify-content:center;margin-top:12px"></div>
        <div id="kapBox"></div><button class="ghost" type="button" id="avZnova">🖌️ Nakresliť svoj obrázok</button></div>`;
    case 'kresli-vyber':
      if (j.kreslim && j.ponuka) return `<div class="card">${hlavicka(h)}<h2>🎨 Vyber si, čo nakreslíš</h2><div class="opts">${j.ponuka.map((w, u) => `<button type="button" class="opt" data-slovo="${u}">
          <span style="font-size:28px">${['😊', '🤔', '🔥'][u]}</span><span style="flex:1">${esc(w)}<br><small>${['ľahké · body ×1', 'stredné · body ×1,5', 'ťažké · body ×2'][u]}</small></span></button>`).join('')}</div>
          <p class="status">Za ťažšie slovo dostaneš viac bodov ty aj tí, čo ho uhádnu.</p></div>`;
      return `<div class="card center">${hlavicka(h)}<div class="icon">🎨</div><h2><span style="color:${farba(h.kreslic)}">${esc(meno(h.kreslic))}</span> si vyberá slovo…</h2><p class="muted">Priprav sa hádať!</p></div>`;
    case 'reflex':
      return `<div class="card">${hlavicka(h)}<div class="rfx" id="rfx">Čakaj…</div><p class="status">Keď zozelenie, ťukni čo najrýchlejšie. Neťukaj skôr!</p></div>`;
    case 'reflex-vysledok': {
      const zoz = Object.entries(h.casy || {}).sort((a, b) => a[1] - b[1]), r = zoz.findIndex(x => x[0] === me.id);
      return `<div class="card center">${hlavicka(h)}<div class="icon">${j.skoro ? '❌' : r === 0 ? '🥇' : r === 1 ? '🥈' : r === 2 ? '🥉' : '⚡'}</div>
        <div class="big">${j.skoro ? 'Priskoro!' : j.cas != null ? j.cas + ' ms' : 'Neťukol si'}</div><div class="res ${j.zisk > 0 ? 'ok' : j.zisk < 0 ? 'bad' : ''}">${j.zisk ? (j.zisk > 0 ? '+' : '') + j.zisk : ''}</div>

    cv.addEventListener('pointerdown', e => this.dole(e));
    cv.addEventListener('pointermove', e => this.pohyb(e));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { this.akt = null; }));
    clearInterval(this.timer); this.timer = setInterval(() => this.odosli(), 110);
    window.onresize = () => this.resize();
    this.toolsKey = '';
  },
  stop() { if (this.cv) { clearInterval(this.timer); this.cv = null; window.onresize = null; } },
  resize() {
    if (!this.cv) return;
    const r = this.cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.width * 4 / 3 * dpr);
    this.prekresli();
  },
  noveSlovo(s) { if (this.slovo !== null && this.slovo !== s) { this.tahy = []; this.ops = []; this.prekresli(); } this.slovo = s; },
  bod(e) { const r = this.cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000), Math.round((e.clientY - r.top) / r.height * 1333)]; },   // plátno 1000 × 1333 (na výšku)
  dole(e) {
    e.preventDefault();
    try { this.cv.setPointerCapture(e.pointerId); } catch (err) {}
    const [x, y] = this.bod(e), c = this.guma ? '#FFFFFF' : this.farba, w = this.guma ? 40 : this.hrubka;
    if (this.vedro && !this.guma) {   // 🪣 výplň uzavretej plochy
      const k = this.cv.width / 1000;
      this.tahy.push({f: 1, x, y, c: this.farba}); this.ops.push(['f', x, y, this.farba]);
      vypln(this.g, x * k, y * k, this.farba); return;
    }
    this.akt = {id: ++this.sid, c, w, p: [x, y]};
    this.tahy.push(this.akt);
    this.ops.push(['s', this.akt.id, c, w, x, y]);
    this.prekresli();
  },
  pohyb(e) {
    if (!this.akt) return;
    const [x, y] = this.bod(e), p = this.akt.p;
    if (Math.hypot(x - p[p.length - 2], y - p[p.length - 1]) < 3) return;
    p.push(x, y);
    const last = this.ops[this.ops.length - 1];
    if (last && last[0] === 'p' && last[1] === this.akt.id) last.push(x, y); else this.ops.push(['p', this.akt.id, x, y]);
    this.ciara(this.akt, p.length - 4);
  },
  ciara(t, od) {
    const g = this.g, k = this.cv.width / 1000, p = t.p;
    g.strokeStyle = t.c; g.lineWidth = t.w * k; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(p[od] * k, p[od + 1] * k); g.lineTo(p[od + 2] * k, p[od + 3] * k); g.stroke();
  },
  prekresli() {
    if (!this.g) return;
    const g = this.g, k = this.cv.width / 1000;
    g.fillStyle = '#fff'; g.fillRect(0, 0, this.cv.width, this.cv.height);
    for (const t of this.tahy) {
      if (t.f) { vypln(g, t.x * k, t.y * k, t.c); continue; }
      g.fillStyle = t.c; g.beginPath(); g.arc(t.p[0] * k, t.p[1] * k, t.w * k / 2, 0, Math.PI * 2); g.fill();
      for (let i = 0; i + 3 < t.p.length; i += 2) this.ciara(t, i);
    }
  },
  spat() { this.tahy.pop(); this.ops.push(['u']); this.prekresli(); },
  zmaz() { this.tahy = []; this.ops.push(['c']); this.prekresli(); },
  odosli() {
    if (this.posiela || !this.ops.length) return;
    const ops = this.ops; this.ops = []; this.posiela = true;
    posli('kresba', {ops}).then(r => { if (!r.ok) throw new Error(); }).catch(() => { this.ops = ops.concat(this.ops); }).finally(() => { this.posiela = false; });
  },
  tools(j) {
    const box = $('#tools'); if (!box) return;
    const key = [this.farba, this.hrubka, this.guma, this.vedro, j.ine].join('|');
    if (key === this.toolsKey) return;
    this.toolsKey = key;
    box.innerHTML = FARBY.map(c => `<button type="button" class="col${!this.guma && c === this.farba ? ' on' : ''}" style="--c:${c}" data-c="${c}" aria-label="farba"></button>`).join('') +
      HRUBKY.map(w => `<button type="button" class="size${!this.guma && !this.vedro && w === this.hrubka ? ' on' : ''}" data-w="${w}"><i style="width:${Math.max(5, w * .7)}px;height:${Math.max(5, w * .7)}px"></i></button>`).join('') +
      `<button type="button" class="tbtn" data-t="vedro" style="${this.vedro ? 'background:rgba(255,255,255,.3);border-color:#fff' : ''}">🪣 Výplň</button><button type="button" class="tbtn${this.guma ? ' on' : ''}" data-t="guma" style="${this.guma ? 'background:rgba(255,255,255,.3)' : ''}">🧽 Guma</button><button type="button" class="tbtn" data-t="spat">↶ Späť</button><button type="button" class="tbtn" data-t="zmaz">🗑️ Všetko</button>` +
      (j.ine ? '<button type="button" class="tbtn" data-t="ine">🔄 Iné slovo</button>' : '');
    box.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.c) { this.farba = b.dataset.c; this.guma = false; }
      else if (b.dataset.w) { this.hrubka = +b.dataset.w; this.guma = false; this.vedro = false; }
      else if (b.dataset.t === 'vedro') { this.vedro = !this.vedro; this.guma = false; }
      else if (b.dataset.t === 'guma') { this.guma = !this.guma; this.vedro = false; }
      else if (b.dataset.t === 'spat') this.spat();
      else if (b.dataset.t === 'zmaz') this.zmaz();
      else if (b.dataset.t === 'ine') { posli('ine').then(() => poll(true)).catch(chyba); }
      this.toolsKey = ''; this.tools(ja());
    };
  }
};

/* ---------- bleskový reflex: čas sa meria tu v mobile, od chvíle, keď sa plocha rozsvieti ---------- */
const reflex = {
  krok: -1, t0: 0, za: 0, greenT: 0, hotovo: false, raf: 0,
  start(h) {
    if (this.krok !== h.krok) { this.krok = h.krok; this.t0 = performance.now(); this.za = h.za || 3000; this.greenT = 0; this.hotovo = false; }
    const el = $('#rfx'); if (!el) return;
    cancelAnimationFrame(this.raf);
    const krok = h.krok;
    const tick = () => {
      if (this.krok !== krok || !el.isConnected) return;
      if (this.hotovo) return;
      if (!hra().pauza && !this.greenT && performance.now() - this.t0 >= this.za) { this.greenT = performance.now(); el.classList.add('go'); el.textContent = 'ŤUKNI!'; if (navigator.vibrate) navigator.vibrate(60); }
      this.raf = requestAnimationFrame(tick);
    };
    tick();
    el.onpointerdown = e => {
      e.preventDefault();
      if (this.hotovo || this.krok !== krok) return;
      this.hotovo = true;
      const skoro = !this.greenT, ms = Math.round(performance.now() - this.greenT);
      el.classList.remove('go'); el.classList.add('done');
      el.textContent = skoro ? '❌ Priskoro!' : ms + ' ms';
      posli('reflex', skoro ? {skoro: true} : {ms}).then(() => poll(true)).catch(chyba);
    };
    const j = ja(); if (j.cas != null || j.skoro) { this.hotovo = true; el.classList.add('done'); el.textContent = j.skoro ? '❌ Priskoro!' : j.cas + ' ms'; }
  }
};

/* ---------- avatar: hráč si nakreslí sám seba ---------- */
let avEdit = false, avAuto = false;
const avatar = {
  cv: null, g: null, rezim: 'kresli', tahy: [], akt: null, farba: '#111111', hrubka: 14,
  foto: null, mierka: 1, zoom: 1, ox: 0, oy: 0, prsty: {},          // fotka z galérie: posúvanie a približovanie
  emoji: '😎', pozadie: '#FFD93D',
  start() {
    const cv = $('#avcv'); if (!cv) return;
    this.cv = cv; this.g = cv.getContext('2d');
    const bod = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 600, (e.clientY - r.top) / r.height * 600]; };
    cv.onpointerdown = e => {
      e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      if (this.rezim === 'kresli') { this.akt = {c: this.farba, w: this.hrubka, p: [bod(e)]}; this.tahy.push(this.akt); this.kresli(); }
      if (this.rezim === 'foto') this.prsty[e.pointerId] = bod(e);
    };
    cv.onpointermove = e => {
      if (this.rezim === 'kresli' && this.akt) { this.akt.p.push(bod(e)); this.kresli(); }
      if (this.rezim === 'foto' && this.prsty[e.pointerId] && this.foto) {
        const ids = Object.keys(this.prsty), nb = bod(e);
        if (ids.length === 1) { const [x, y] = this.prsty[e.pointerId]; this.ox += nb[0] - x; this.oy += nb[1] - y; }
        else if (ids.length === 2) {   // dvoma prstami priblížiť / oddialiť
          const druhy = this.prsty[ids.find(i => +i !== e.pointerId)], stary = this.prsty[e.pointerId];
          const d0 = Math.hypot(stary[0] - druhy[0], stary[1] - druhy[1]), d1 = Math.hypot(nb[0] - druhy[0], nb[1] - druhy[1]);
          if (d0 > 10) this.nastavZoom(this.zoom * d1 / d0);
        }
        this.prsty[e.pointerId] = nb; this.kresli();
      }
    };
    cv.onpointerup = cv.onpointercancel = e => { this.akt = null; delete this.prsty[e.pointerId]; };
    $('#avTabs').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; this.rezim = b.dataset.m; if (this.rezim === 'foto' && !this.foto) $('#avFile').click(); this.nastroje(); this.kresli(); };
    $('#avFile').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) this.nacitajFotku(f); e.target.value = ''; };
    $('#avOk').onclick = () => this.uloz();
    $('#avSkip').onclick = () => { try { localStorage.setItem('kck-av-skip-' + me.id, '1'); } catch (e) {} avEdit = false; lastKey = ''; render(); };
    this.nastroje(); this.kresli();
  },
  nacitajFotku(f) {
    const img = new Image();
    img.onload = () => { this.foto = img; this.mierka = Math.max(600 / img.naturalWidth, 600 / img.naturalHeight); this.zoom = 1; this.ox = 0; this.oy = 0; this.rezim = 'foto'; this.nastroje(); this.kresli(); };
    img.onerror = () => { $('#status').textContent = 'Túto fotku sa nepodarilo načítať.'; };
    img.src = URL.createObjectURL(f);
  },
  nastavZoom(z) { this.zoom = Math.max(1, Math.min(5, z)); const sl = $('#avZoom'); if (sl) sl.value = this.zoom; },
  nastroje() {
    document.querySelectorAll('#avTabs [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === this.rezim));
    const box = $('#avTools');
    if (this.rezim === 'kresli') {
      const farby = ['#111111', '#E53935', '#1E88E5', '#43A047', '#FDD835', '#FB8C00', '#8E24AA', '#6D4C41', '#F4C2A1'];
      box.innerHTML = farby.map(c => `<button type="button" class="col${c === this.farba ? ' on' : ''}" style="--c:${c}" data-c="${c}"></button>`).join('') +
        [8, 14, 30].map(w => `<button type="button" class="size${w === this.hrubka ? ' on' : ''}" data-w="${w}"><i style="width:${w / 2 + 3}px;height:${w / 2 + 3}px"></i></button>`).join('') +
        '<button type="button" class="tbtn" data-t="spat">↶ Späť</button><button type="button" class="tbtn" data-t="zmaz">🗑️ Všetko</button>';
    } else if (this.rezim === 'foto') {
      box.innerHTML = this.foto ? `<p class="muted" style="margin:0;width:100%;font-size:14px">Posuň fotku prstom, priblíž dvoma prstami alebo posuvníkom.</p>
        <input type="range" class="zoom" id="avZoom" min="1" max="5" step="0.01" value="${this.zoom}"><button type="button" class="tbtn" data-t="ina">🖼️ Vybrať inú fotku</button>`
        : '<button type="button" class="go" data-t="ina" style="margin:0">🖼️ Vybrať fotku z galérie</button>';
      const z = $('#avZoom'); if (z) z.oninput = () => { this.zoom = +z.value; this.kresli(); };
    } else {
      const em = ['😎', '😀', '😂', '🥳', '😍', '🤠', '🤓', '😜', '🥸', '😺', '🐶', '🐼', '🦊', '🐸', '🐵', '🦁', '🐻', '🐷', '🦄', '🐙', '👽', '🤖', '👻', '💩', '🎃', '⚽', '🍕', '🌵', '🌈', '⭐', '🔥', '👑'];
      const poz = ['#FFD93D', '#FF4D8D', '#22C3A6', '#4FC3F7', '#9B7BFF', '#FF7A45', '#B5E61D', '#FFFFFF'];
      box.innerHTML = em.map(x => `<button type="button" class="emo${x === this.emoji ? ' on' : ''}" data-e="${x}">${x}</button>`).join('') +
        '<div style="width:100%;height:4px"></div>' + poz.map(c => `<button type="button" class="col${c === this.pozadie ? ' on' : ''}" style="--c:${c}" data-p="${c}"></button>`).join('');
    }
    box.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.c) this.farba = b.dataset.c; else if (b.dataset.w) this.hrubka = +b.dataset.w;
      else if (b.dataset.t === 'spat') this.tahy.pop(); else if (b.dataset.t === 'zmaz') this.tahy = [];
      else if (b.dataset.t === 'ina') { $('#avFile').click(); return; }
      else if (b.dataset.e) this.emoji = b.dataset.e; else if (b.dataset.p) this.pozadie = b.dataset.p;
      this.nastroje(); this.kresli();
    };
  },
  kresli() {
    const g = this.g; g.fillStyle = '#fff'; g.fillRect(0, 0, 600, 600);
    if (this.rezim === 'foto') {
      if (!this.foto) { g.fillStyle = '#ddd'; g.font = '700 34px system-ui'; g.textAlign = 'center'; g.fillText('Vyber fotku 🖼️', 300, 310); return; }
      const s = this.mierka * this.zoom, w = this.foto.naturalWidth * s, h = this.foto.naturalHeight * s;
      this.ox = Math.min((w - 600) / 2, Math.max(-(w - 600) / 2, this.ox)); this.oy = Math.min((h - 600) / 2, Math.max(-(h - 600) / 2, this.oy));   // fotka nesmie odísť z kruhu
      g.drawImage(this.foto, 300 - w / 2 + this.ox, 300 - h / 2 + this.oy, w, h);
      return;
    }
    if (this.rezim === 'emoji') {
      g.fillStyle = this.pozadie; g.fillRect(0, 0, 600, 600);
      g.font = '380px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(this.emoji, 300, 330); return;
    }
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const t of this.tahy) {
      g.strokeStyle = t.c; g.fillStyle = t.c; g.lineWidth = t.w;
      if (t.p.length === 1) { g.beginPath(); g.arc(t.p[0][0], t.p[0][1], t.w / 2, 0, Math.PI * 2); g.fill(); continue; }
      g.beginPath(); g.moveTo(t.p[0][0], t.p[0][1]); t.p.forEach(([x, y]) => g.lineTo(x, y)); g.stroke();
    }
  },
  async uloz() {
    if (this.rezim === 'kresli' && !this.tahy.length) { $('#status').textContent = 'Najprv sa nakresli 🙂'; return; }
    if (this.rezim === 'foto' && !this.foto) { $('#status').textContent = 'Najprv vyber fotku.'; return; }
    const off = document.createElement('canvas'); off.width = off.height = 160;
    const o = off.getContext('2d'); o.drawImage(this.cv, 0, 0, 160, 160);
    $('#avOk').disabled = true;
    try {
      const r = await api('avatar?id=' + encodeURIComponent(me.id), {img: off.toDataURL('image/png')});
      if (!r.ok) throw new Error();
      avEdit = false; lastKey = ''; poll(true);
    } catch (e) { $('#status').textContent = 'Obrázok sa nepodarilo odoslať, skús znova.'; $('#avOk').disabled = false; }
  }
};

/* ---------- spojenie ---------- */
let pollT = null, polling = false;
async function poll(hned) {
  if (hned) { clearTimeout(pollT); }
  if (polling) return;   // otvorená požiadavka vráti zmenu hneď, ako ju TV pošle
  polling = true;
  const t0 = Date.now();
  try {
    // v = verzia, ktorú už máme – server odpovie, až keď sa niečo zmení (najviac o 3 s)
    const q = [me && me.id ? 'id=' + encodeURIComponent(me.id) : '', S && S.ver != null && me && me.id && !$('#game').hidden ? 'v=' + S.ver : ''].filter(Boolean).join('&');
    const s = await api('state' + (q ? '?' + q : ''));
    failCount = 0; $('#status').textContent = ''; $('#status').className = 'status';
    S = s;
    if (me && me.id && !$('#game').hidden && s.known === false) {     // server nás nepozná (reštart) – pripojíme sa znova
      const r = await api('join', {name: me.name}); if (!r.error) { me = {id: r.id, name: r.name}; saveMe(); }
    }
    if (!$('#join').hidden) paintBack();
    render();
  } catch (e) {
    failCount++;
    if (failCount > 3) { $('#status').textContent = 'Spojenie sa stratilo. Skúšam znova…'; $('#status').className = 'status err'; }
  }
  polling = false;
  clearTimeout(pollT); pollT = setTimeout(poll, failCount > 3 ? 1500 : failCount ? 350 : Math.max(40, 250 - (Date.now() - t0)));
}
setInterval(() => { if (S) obnov(hra(), ja()); }, 250);   // plynulá časomiera

/* displej nech nezhasne */
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator && (!wake || wake.released)) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); poll(true); } });
document.addEventListener('pointerdown', keepAwake, {once: true});

if (me && me.id) showGame(); else showJoin();
poll();
